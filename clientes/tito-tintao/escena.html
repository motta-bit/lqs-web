<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tito Tintao · la escena</title>
<meta name="description" content="La zarigüeya de Tito Tintao actuando la escena de la aguja, hasta el logo.">
<meta name="theme-color" content="#f4f2ee">
<style>
/* ══════════════════════════════════════════════════════════════════
   TITO TINTAO · la escena de la aguja

   Muñeco recortado de la hoja de giro y articulado. Las seis piezas
   vuelven a montar el dibujo original SIN PERDER UN PÍXEL —está
   comprobado— así que la pose de reposo es exactamente la que dibujaste
   y todo lo que se mueve parte de ahí.

   La animación entera es una FUNCIÓN DEL TIEMPO: nada guarda estado.
   Eso es lo que hace que la barra de abajo se pueda arrastrar a
   cualquier punto, hacia delante o hacia atrás, y la escena esté
   siempre exactamente donde tiene que estar. Un animador necesita
   parar en el fotograma 143 y mirarlo: con animaciones por CSS eso no
   se puede, con esto sí.
   ══════════════════════════════════════════════════════════════════ */

:root{
  --papel:#f4f2ee;
  --tinta:#141414;
  --rosa:#e8a6d4;
  --sangre:#9d2b24;
  --suelo:#e2dfd9;
  --ui:#1a1a1a;
  --ui-suave:rgba(20,20,20,.58);
  --borde:rgba(20,20,20,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);
  font:400 16px/1.5 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  overflow:hidden}
img{display:block}

/* ── el escenario ─────────────────────────────────────────────────── */
.escena{flex:1 1 auto;position:relative;overflow:hidden;min-height:0;
  background:var(--papel);touch-action:none}
/* el plano blanco: una línea de suelo y nada más. Es el encuadre que
   pediste, y además deja que el bicho sea lo único que haya que mirar. */
.suelo{position:absolute;left:-1400px;width:2800px;height:2px;
  background:var(--suelo);top:0}
.mundo{position:absolute;inset:0;transform-origin:50% 50%}

.bicho{position:absolute;width:422px;height:651px;left:0;top:0;
  transform-origin:211px 640px}            /* el pivote es donde pisa */
.pieza{position:absolute;transform-origin:center}
.pieza img{width:100%;height:100%}

/* El orden de pintado importa: piernas y brazos por debajo, el torso
   encima tapando los cantos del recorte, y la cabeza al final. */
.pIzq{left:105px;top:430px;width:115px;height:221px;transform-origin:60px 25px}
.pDer{left:195px;top:430px;width:120px;height:221px;transform-origin:55px 25px}
.bIzq{left:5px;top:205px;width:160px;height:235px;transform-origin:125px 25px}
.bDer{left:275px;top:205px;width:140px;height:235px;transform-origin:20px 25px}
.torso{left:105px;top:190px;width:225px;height:280px;transform-origin:107px 260px}
.cabeza{left:95px;top:0;width:235px;height:270px;transform-origin:117px 215px}

/* ── la aguja ─────────────────────────────────────────────────────── */
.aguja{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0}
/* el suelo como materia: tapa lo que se hunde. Va por delante de la aguja
   y por detrás del bicho, que es justo el orden de un plano 2D. */
.tierra{position:absolute;left:-1600px;top:0;width:3200px;height:2600px;
  background:var(--papel)}

/* ── el logo ──────────────────────────────────────────────────────── */
.logo{position:absolute;left:0;top:0;transform-origin:center;opacity:0;
  pointer-events:none}
.logo img{width:100%;height:auto}

/* el fogonazo del impacto. Tapa el cambio del muñeco al logotipo: son
   dos dibujos distintos y el corte en blanco los cose sin que se note. */
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* polvo y rayas de velocidad, dibujados en lienzo */
.polvo{position:absolute;inset:0;pointer-events:none}

/* ── la barra de transporte ───────────────────────────────────────── */
.barra{flex:none;display:flex;align-items:center;gap:clamp(10px,2vw,18px);
  padding:clamp(10px,1.6vh,16px) clamp(14px,3vw,28px);
  border-top:1px solid var(--borde);background:rgba(244,242,238,.86);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%)}
.marca{font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:.7rem;white-space:nowrap;color:var(--ui)}
.marca span{font-weight:400;color:var(--ui-suave);letter-spacing:.06em;
  text-transform:none;margin-left:8px}
@media (max-width:720px){.marca span{display:none}}

button{appearance:none;font:inherit;cursor:pointer;border:1px solid var(--borde);
  background:#fff;color:var(--ui);border-radius:999px;
  padding:9px 16px;font-size:.84rem;font-weight:600;white-space:nowrap;
  transition:transform .1s ease,background .15s,border-color .15s}
button:active{transform:scale(.96)}          /* el único feedback que hay en móvil */
@media (hover:hover) and (pointer:fine){
  button:hover{background:#fff;border-color:rgba(20,20,20,.38)}
}
button[aria-pressed="true"]{background:var(--ui);color:#fff;border-color:var(--ui)}
.play{width:42px;height:42px;padding:0;display:grid;place-items:center;flex:none}
.play svg{width:15px;height:15px;fill:currentColor}

.pista{flex:1 1 auto;position:relative;height:42px;display:flex;align-items:center;
  cursor:pointer;touch-action:none;min-width:0}
.riel{position:absolute;left:0;right:0;height:4px;border-radius:2px;
  background:rgba(20,20,20,.13)}
.lleno{position:absolute;left:0;height:4px;border-radius:2px;background:var(--ui);
  width:0}
.pulgar{position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--ui);border:2px solid var(--papel);left:0;margin-left:-8px;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
/* los hitos de cada golpe de la escena, para poder saltar a uno */
.hito{position:absolute;width:2px;height:11px;background:rgba(20,20,20,.3);
  margin-left:-1px;border-radius:1px;pointer-events:none}
.reloj{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ui-suave);
  white-space:nowrap;flex:none}
.golpe{flex:none;font-size:.78rem;color:var(--ui-suave);min-width:11ch;
  text-align:right;white-space:nowrap}
@media (max-width:620px){.golpe,.reloj{display:none}}

.aviso{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:.74rem;color:var(--ui-suave);background:rgba(255,255,255,.8);
  padding:6px 12px;border-radius:999px;border:1px solid var(--borde);
  pointer-events:none;opacity:0;transition:opacity .4s ease}
.aviso.visible{opacity:1}

@media (prefers-reduced-motion:reduce){
  button{transition:none}
}
@media (prefers-contrast:more){
  :root{--borde:rgba(20,20,20,.5);--ui-suave:#1a1a1a;--suelo:#8a8780}
}
</style>
</head>

/* ══ 2 · interpolación ═══════════════════════════════════════════════
   Cada canal es una lista de hitos. Entre dos hitos se interpola con la
   curva que pida el primero de ellos. Escrito así, mover un golpe de
   sitio es cambiar un número, que es como se afina una animación. */

function suave(u){ return u*u*(3-2*u); }                 /* entra y sale */
function fuera(u){ return 1-Math.pow(1-u,3); }           /* frena al final */
function dentro(u){ return u*u*u; }                      /* arranca lento */
function lineal(u){ return u; }
/* rebote: para lo que cae y se asienta con peso */
function rebote(u){
  var w = 2*Math.PI/0.42;
  return 1 - Math.exp(-5.2*u) * Math.cos(w*u*0.55);
}
/* tiritón que se apaga: el golpe de la aguja al clavarse */
function tiembla(u){ return Math.exp(-7*u) * Math.sin(u*Math.PI*9); }

var CURVAS = {suave:suave, fuera:fuera, dentro:dentro, lineal:lineal, rebote:rebote};

function canal(hitos, tt){
  if (tt <= hitos[0][0]) return hitos[0][1];
  var n = hitos.length;
  if (tt >= hitos[n-1][0]) return hitos[n-1][1];
  for (var i = 0; i < n-1; i++){
    var a = hitos[i], b = hitos[i+1];
    if (tt >= a[0] && tt <= b[0]){
      var u = (tt - a[0]) / (b[0] - a[0] || 1);
      var f = CURVAS[a[2] || 'suave'] || suave;
      return a[1] + (b[1] - a[1]) * f(u);
    }
  }
  return hitos[n-1][1];
}

            [8.2,1.0,'suave'],[8.55,1.0,'dentro'],[8.62,1.1,'rebote'],
            [9.0,1.04,'suave'],[9.2,1,'suave'],[10.6,1,'lineal']],
  camX:    [[0,0,'lineal'],[3.95,0,'suave'],[4.35,-74,'suave'],[5.55,-120,'suave'],
            [7.3,-120,'suave'],[7.5,-40,'suave'],[8.2,0,'suave'],[10.6,0,'lineal']],
  camY:    [[0,0,'lineal'],[4.35,-54,'suave'],[5.55,-72,'suave'],[7.3,-72,'suave'],
            [7.5,40,'suave'],[7.95,250,'suave'],[8.25,250,'suave'],
            [8.55,-20,'suave'],[9.2,-150,'suave'],[10.6,-150,'lineal']],

  /* ── el cambio al logo ── */
  flash:   [[0,0,'lineal'],[8.54,0,'lineal'],[8.57,1,'lineal'],[8.72,0,'fuera'],
            [10.6,0,'lineal']],
  bichoOp: [[0,1,'lineal'],[9.05,1,'lineal'],[9.2,0,'suave'],[10.6,0,'lineal']],
  logoOp:  [[0,0,'lineal'],[9.05,0,'lineal'],[9.2,1,'suave'],[10.6,1,'lineal']],
  logoEsc: [[0,0.56,'lineal'],[9.2,0.58,'suave'],[9.9,0.66,'fuera'],
            [10.6,0.672,'lineal']]
};

/* ══ 4 · el run cycle ════════════════════════════════════════════════
   No es un canal: es un ciclo. Mientras corre, las piernas van en
   oposición y el cuerpo sube y baja al DOBLE de frecuencia, que es lo
   que hace que un ciclo lea como carrera y no como baile. */
function ciclo(tt){
  var i0 = 1.75, i1 = 3.45;
  if (tt < i0 || tt > i1 + 0.3) return null;
  var k = Math.min(1, (i1 + 0.3 - tt) / 0.3);          /* se apaga al frenar */
  var f = 3.4;                                          /* zancadas por segundo */
  var a = (tt - i0) * f * Math.PI * 2;
  return {
    pIzq: Math.sin(a) * 42 * k,
    pDer: Math.sin(a + Math.PI) * 42 * k,
    /* 48 grados de base para bajarlos del reposo en T, y el vaivén encima */
    bIzq: (48 + Math.sin(a + Math.PI) * 26) * k,
    bDer: (-48 + Math.sin(a) * 26) * k,
    bote: -Math.abs(Math.sin(a)) * 15 * k,
    cab:  Math.sin(a * 2) * 2.4 * k
  };
}

/* el tirón: mientras jala, el cuerpo vibra contra la resistencia */
function tiron(tt){
  if (tt < 5.55 || tt > 7.35) return 0;
  var golpes = [[5.95,1],[6.45,1.35],[7.05,1.8]];
  var s = 0;
  for (var i = 0; i < golpes.length; i++){
    var d = tt - golpes[i][0];
    if (d > -0.22 && d < 0.5) s += tiembla(Math.max(0, d) / 0.5) * golpes[i][1];
  }
  return s;
}

/* ══ 5 · pintar un instante ══════════════════════════════════════════ */
var $ = function(id){ return document.getElementById(id); };
var mundo = $('mundo'), bicho = $('bicho'), suelo = $('suelo');
var cabeza = $('cabeza'), torso = $('torso'), bIzq = $('bIzq'), bDer = $('bDer'),
    pIzq = $('pIzq'), pDer = $('pDer');
var aguja = $('aguja'), logo = $('logo'), flash = $('flash'), polvo = $('polvo');
var ctx = polvo.getContext('2d');

var W = 0, HH = 0, SUELO_Y = 0, BASE = 1;
function medir(){
  var r = $('escena').getBoundingClientRect();
  W = r.width; HH = r.height;
  /* la escena está dibujada para 1100×620; se escala para caber entera */
  BASE = Math.min(W / 1560, HH / 980);
  /* el bicho mide 651 de alto: la escala se calcula para que quepa
     entero con aire, también cuando la cámara se acerca a 1,26 */
  SUELO_Y = HH * 0.84;
  var dpr = Math.min(2, devicePixelRatio || 1);
  polvo.width = W * dpr; polvo.height = HH * dpr;
  polvo.style.width = W + 'px'; polvo.style.height = HH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function pose(tt){
  var c = canal.bind(null);
  var cic = ciclo(tt), tir = tiron(tt);

  var zoom = c(ESC.camZoom, tt) * BASE;
  mundo.style.transform =
    'translate(' + (W/2 + c(ESC.camX, tt)*BASE) + 'px,' +
                   (SUELO_Y + c(ESC.camY, tt)*BASE) + 'px) scale(' + zoom + ')';

  /* el bicho: su pivote es la planta del pie, en (211, 640) */
  var bx = c(ESC.x, tt) + tir * 7;
  var by = c(ESC.y, tt) + (cic ? cic.bote : 0);
  var sq = c(ESC.squash, tt);
  bicho.style.opacity = c(ESC.bichoOp, tt);
  bicho.style.transform =
    'translate(' + (bx - 211) + 'px,' + (by - 640) + 'px)' +
    ' scale(' + (1/sq).toFixed(4) + ',' + sq.toFixed(4) + ')';

  var lean = c(ESC.lean, tt) + tir * 2.2;
  torso.style.transform  = 'rotate(' + lean + 'deg)';
  cabeza.style.transform = 'rotate(' + (c(ESC.cabRot, tt) + lean*0.45 +
      (cic ? cic.cab : 0) + tir*1.6) + 'deg) translateY(' + c(ESC.cabY, tt) + 'px)';
  bIzq.style.transform = 'rotate(' + (c(ESC.bIzqRot, tt) + (cic ? cic.bIzq : 0) + tir*4) + 'deg)';
  bDer.style.transform = 'rotate(' + (c(ESC.bDerRot, tt) + (cic ? cic.bDer : 0) - tir*4) + 'deg)';
  pIzq.style.transform = 'rotate(' + (cic ? cic.pIzq : 0) + 'deg)';
  pDer.style.transform = 'rotate(' + (cic ? cic.pDer : 0) + 'deg)';

  /* El origen de la aguja es su punta: el viewBox empieza en -360, así que
     la punta (vy 718) cae en el píxel 1078 del elemento. Anclando ahí, girar
     no mueve la punta — que es exactamente lo que hace una aguja clavada. */
  aguja.style.transformOrigin = '120px 1078px';
  aguja.style.transform =
    'translate(' + (XAGUJA + c(ESC.agX, tt) - 120) + 'px,' +
                   (c(ESC.agPunta, tt) - 1078) + 'px)' +
    ' rotate(' + c(ESC.agRot, tt) + 'deg)';

  flash.style.opacity = c(ESC.flash, tt);

  /* El logo se coloca contra la CÁMARA, no contra el mundo: así queda
     centrado en el encuadre pase lo que pase con el viaje o el zoom. */
  var le = c(ESC.logoEsc, tt);
  logo.style.opacity = c(ESC.logoOp, tt);
  logo.style.width = 1218 * le + 'px';
  logo.style.transform =
    'translate(' + (-c(ESC.camX, tt) - 1218*le/2) + 'px,' +
                   (-c(ESC.camY, tt) - 1116*le/2) + 'px)';

  dibujaPolvo(tt, cic, zoom);
  $('reloj').textContent = tt.toFixed(1).replace('.', ',') + ' s';
  var g = GOLPES[0][1];
  for (var i = 0; i < GOLPES.length; i++) if (tt >= GOLPES[i][0]) g = GOLPES[i][1];
  $('golpeTxt').textContent = g;
  var p = tt / DUR;
  $('lleno').style.width = (p*100) + '%';
  $('pulgar').style.left = (p*100) + '%';
  $('pista').setAttribute('aria-valuenow', Math.round(p*100));
}

/* ══ 6 · polvo y rayas ═══════════════════════════════════════════════
   Se pinta a partir del tiempo, igual que todo lo demás: con una semilla
   fija, el mismo instante da siempre el mismo polvo. Si dependiera de un
   azar vivo, al arrastrar la barra atrás el polvo saltaría. */
function azar(n){ var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function dibujaPolvo(tt, cic, zoom){
  ctx.clearRect(0, 0, W, HH);
  var cx = W/2 + canal(ESC.camX, tt)*BASE;
  var cy = SUELO_Y + canal(ESC.camY, tt)*BASE;
  var px = function(x, y){ return [cx + x*zoom, cy + y*zoom]; };
  var bx = canal(ESC.x, tt);

  /* rayas de velocidad mientras corre */
  if (cic && tt > 1.9 && tt < 3.5){
    ctx.strokeStyle = 'rgba(20,20,20,.16)';
    for (var i = 0; i < 7; i++){
      var s = azar(i*3.7 + Math.floor(tt*14));
      var yy = -40 - s*330;
      var lar = 60 + s*150;
      var a = px(bx - 150 - s*170, yy), b = px(bx - 150 - s*170 - lar, yy);
      ctx.lineWidth = (1 + s*1.6) * zoom;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
  /* polvareda del frenazo */
  if (tt > 3.62 && tt < 4.3){
    var u = (tt - 3.62) / 0.68;
    ctx.fillStyle = 'rgba(20,20,20,' + (0.13 * (1-u)).toFixed(3) + ')';
    for (var j = 0; j < 14; j++){
      var s2 = azar(j*5.1);
      var d = (20 + s2*210) * u;
      var p2 = px(bx - 40 - d, -10 - s2*44*u);
      ctx.beginPath();
      ctx.arc(p2[0], p2[1], (5 + s2*22) * u * zoom, 0, 6.283); ctx.fill();
    }
  }
  /* anillo de polvo cuando la aguja sale y cuando se clava */
  [[7.38, 0.5, 240], [8.56, 0.55, 300]].forEach(function(g){
    if (tt > g[0] && tt < g[0] + g[1]){
      var u2 = (tt - g[0]) / g[1];
      ctx.strokeStyle = 'rgba(20,20,20,' + (0.3*(1-u2)).toFixed(3) + ')';
      ctx.lineWidth = (2.4*(1-u2) + 0.4) * zoom;
      var r = fuera(u2) * g[2];
      var o = px(XAGUJA - 60, 0);
      ctx.beginPath();
      ctx.ellipse(o[0], o[1], r*zoom, r*0.26*zoom, 0, 0, 6.283); ctx.stroke();
      /* el segundo anillo es el de la cabeza: va donde cayó, no en el suelo */
    }
  });
}

/* ══ 7 · transporte ══════════════════════════════════════════════════ */
var quieto = matchMedia('(prefers-reduced-motion:reduce)');

function cuadro(ahora){
  if (corriendo){
    var dt = ultimo ? Math.min(0.05, (ahora - ultimo)/1000) : 0;
    t += dt * (lento ? 0.32 : 1);
    if (t >= DUR){ t = DUR; parar(); }
    pose(t);
  }
  ultimo = ahora;
  requestAnimationFrame(cuadro);
}

function arranca(){
  if (t >= DUR - 0.001) t = 0;
  corriendo = true; ultimo = 0;
  $('play').setAttribute('aria-label', 'Pausar');
  $('icono').innerHTML = '<path d="M3 1.5h3.5v13H3zM9.5 1.5H13v13H9.5z"/>';
}
function parar(){
  corriendo = false;
  $('play').setAttribute('aria-label', 'Reproducir');
  $('icono').innerHTML = '<path d="M3 1.5v13l11-6.5z"/>';
}
$('play').addEventListener('click', function(){ corriendo ? parar() : arranca(); });
$('lento').addEventListener('click', function(){
  lento = !lento; this.setAttribute('aria-pressed', lento ? 'true' : 'false');
});

/* la barra: arrastre 1 a 1, sin salto al agarrar y sin perder el dedo
   aunque se salga del riel */
var pista = $('pista');
function deEvento(e){
  var r = pista.getBoundingClientRect();
  var u = (e.clientX - r.left) / r.width;
  return Math.max(0, Math.min(1, u)) * DUR;
}
pista.addEventListener('pointerdown', function(e){
  pista.setPointerCapture(e.pointerId);
  parar(); t = deEvento(e); pose(t);
});
pista.addEventListener('pointermove', function(e){
  if (e.buttons) { t = deEvento(e); pose(t); }
});
pista.addEventListener('keydown', function(e){
  var paso = e.shiftKey ? 1 : 1/24;             /* un fotograma a 24 */
  if (e.key === 'ArrowRight'){ parar(); t = Math.min(DUR, t + paso); pose(t); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ parar(); t = Math.max(0, t - paso); pose(t); e.preventDefault(); }
  if (e.key === ' '){ corriendo ? parar() : arranca(); e.preventDefault(); }
});

/* los hitos de cada golpe, marcados en el riel */
GOLPES.forEach(function(g){
  var d = document.createElement('i');
  d.className = 'hito'; d.style.left = (g[0]/DUR*100) + '%';
  pista.appendChild(d);
});

addEventListener('keydown', function(e){
  if (e.target === pista) return;
  if (e.key === ' '){ corriendo ? parar() : arranca(); e.preventDefault(); }
});

var reTimer;
addEventListener('resize', function(){
  clearTimeout(reTimer);
  reTimer = setTimeout(function(){ medir(); pose(t); }, 120);
}, {passive:true});

medir(); pose(0); requestAnimationFrame(cuadro);

if (quieto.matches){
  var av = $('aviso');
  av.textContent = 'Tienes el movimiento reducido activado: usa la barra para recorrerla.';
  av.classList.add('visible');
  setTimeout(function(){ av.classList.remove('visible'); }, 6000);
} else {
  setTimeout(arranca, 500);
}
})();
</script>
</body>
</html>
