<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revista Tendido</title>
<meta name="description" content="Revista de moda: un índice en bento con números fantasma que se abre en paneles de color a pantalla completa, sin salir de la página.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════
   TENDIDO · revista de moda, número 07

   Color   fondo #080809 · tarjeta #121214 · tiza #ededf0
           cada sección trae su propio color pleno y no lo comparte:
           lila #7b5cff · arena #d8b48c · verde #1f6b4a
           coral #ff4d4d · hielo #cfe3ff
   Tipo    Unbounded 700 para los números y las portadas de sección
           (una grotesca geométrica y ancha, no la de siempre);
           Manrope para el cuerpo
   Planta  Columna fija con la cabecera de la revista. A la derecha,
           un índice en bento: cada entrada lleva su número gigante
           recortado por el borde de la tarjeta.

   Al tocar una entrada, la sección NO navega: sube desde abajo un
   panel a color pleno que cubre la columna derecha. Vuelve por el
   mismo camino, porque si algo se va por abajo tiene que volver
   por abajo.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fondo:#080809; --tarjeta:#121214; --tarjeta2:#191a1d;
  --tiza:#ededf0; --gris:#8b8b94; --linea:rgba(237,237,240,.1);
  --disp:'Unbounded',system-ui,sans-serif;
  --cuerpo:'Manrope',system-ui,sans-serif;
  --m:clamp(16px,3.4vw,40px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fondo);color:var(--tiza);font-family:var(--cuerpo);
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:#7b5cff;color:#fff}

.marco{display:grid;grid-template-columns:1fr;gap:var(--m);padding:var(--m);
  min-height:100dvh}
.marco > *{min-width:0}
@media (min-width:980px){
  .marco{grid-template-columns:clamp(260px,26vw,380px) 1fr}
}

/* ── cabecera fija ──────────────────────────────────────────── */
.cab{display:flex;flex-direction:column;gap:20px;padding:6px 0}
@media (min-width:980px){
  .cab{position:sticky;top:var(--m);height:calc(100dvh - var(--m)*2);
    justify-content:space-between}
}
.sello{width:34px;height:34px;border-radius:50%;background:var(--tiza);
  display:grid;place-items:center;color:var(--fondo);font-family:var(--disp);
  font-weight:700;font-size:.82rem;line-height:1}
.cab .est{display:flex;align-items:center;gap:9px;font-size:.66rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}
.cab .est i{width:6px;height:6px;border-radius:50%;background:#1f6b4a;
  box-shadow:0 0 10px #1f6b4a;font-style:normal}
.cab h1{font-family:var(--disp);font-weight:700;
  font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.02;letter-spacing:-.045em}
.cab h1 span{color:var(--gris);font-weight:300}
.cab p{font-size:.86rem;color:var(--gris);max-width:30ch}
.cab a.correo{font-size:.84rem;color:var(--tiza);text-decoration:none;
  border-bottom:1px solid var(--linea);padding-bottom:3px;width:max-content;
  transition:border-color .2s}
.cab a.correo:hover{border-color:#7b5cff}
.cab a.correo:focus-visible{outline:2px solid #7b5cff;outline-offset:4px}

/* ── el índice en bento ─────────────────────────────────────── */
.indice{position:relative;display:grid;gap:10px;
  grid-template-columns:repeat(6,1fr);align-content:start}
.ent{position:relative;overflow:hidden;border:0;cursor:pointer;text-align:left;
  background:var(--tarjeta);border-radius:16px;color:var(--tiza);
  font-family:var(--cuerpo);padding:20px 22px;
  min-height:clamp(118px,15vw,150px);display:flex;flex-direction:column;
  justify-content:flex-end;gap:2px;
  transition:background .26s cubic-bezier(.22,1,.3,1),transform .22s cubic-bezier(.22,1,.3,1)}
.ent:nth-child(1){grid-column:span 3}
.ent:nth-child(2){grid-column:span 3}
.ent:nth-child(3){grid-column:span 2}
.ent:nth-child(4){grid-column:span 4}
.ent:nth-child(5){grid-column:span 6;min-height:clamp(98px,11vw,120px)}
@media (max-width:700px){
  .ent,.ent:nth-child(n){grid-column:span 6}
}
/* el número fantasma: enorme, recortado, detrás de todo */
.ent .fant{position:absolute;right:-.04em;top:50%;translate:0 -50%;
  font-family:var(--disp);font-weight:700;font-size:clamp(5rem,13vw,10rem);
  line-height:.72;letter-spacing:-.06em;color:var(--tarjeta2);
  pointer-events:none;user-select:none;
  transition:color .26s,translate .4s cubic-bezier(.22,1,.3,1)}
.ent small{position:relative;font-size:.72rem;color:var(--gris);
  letter-spacing:.04em;transition:color .26s}
.ent b{position:relative;font-family:var(--disp);font-weight:500;
  font-size:clamp(1rem,2vw,1.28rem);letter-spacing:-.03em;line-height:1.1}
@media (hover:hover) and (pointer:fine){
  .ent:hover{background:var(--tarjeta2);transform:translateY(-3px)}
  .ent:hover .fant{color:var(--tono);translate:0 -54%}
  .ent:hover small{color:var(--tiza)}
}
.ent:active{transform:translateY(0) scale(.994)}
.ent:focus-visible{outline:2px solid var(--tono);outline-offset:3px}

/* ── el panel que sube ──────────────────────────────────────── */
.panel{position:fixed;inset:var(--m);z-index:50;border-radius:20px;
  background:var(--tono);color:#0b0b0c;overflow:auto;overscroll-behavior:contain;
  padding:clamp(22px,4vw,56px);
  transform:translateY(102%);visibility:hidden;
  transition:transform .52s cubic-bezier(.22,1,.3,1),visibility 0s linear .52s}
@media (min-width:980px){
  .panel{left:calc(clamp(260px,26vw,380px) + var(--m)*2)}
}
.panel.on{transform:none;visibility:visible;transition-delay:0s}
.panel.claro{color:#f6f6f8}
.panel .volver{all:unset;display:inline-flex;align-items:center;gap:10px;
  cursor:pointer;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 20px;border-radius:999px;background:rgba(11,11,12,.12);
  margin-bottom:clamp(22px,4vw,44px);transition:background .18s,transform .14s}
.panel.claro .volver{background:rgba(246,246,248,.16)}
.panel .volver:hover{background:rgba(11,11,12,.2)}
.panel.claro .volver:hover{background:rgba(246,246,248,.26)}
.panel .volver:active{transform:scale(.97)}
.panel .volver:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.panel .et{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;opacity:.62}
.panel h2{font-family:var(--disp);font-weight:500;
  font-size:clamp(1.6rem,4.4vw,3.1rem);line-height:1.08;letter-spacing:-.04em;
  margin:12px 0 26px;max-width:18ch;text-wrap:balance}
.panel h2 em{font-style:normal;opacity:.5}
.panel .rejilla{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.panel .rejilla > div > i{font-style:normal;font-size:.68rem;letter-spacing:.14em;opacity:.55}
.panel .rejilla > div > h3{font-family:var(--disp);font-weight:500;font-size:1rem;
  letter-spacing:-.02em;margin:7px 0 6px}
.panel .rejilla > div > p{font-size:.88rem;line-height:1.62;opacity:.78}
/* la figura: geometría al azar, una por panel */
.panel figure{margin-top:clamp(26px,4vw,48px);border-radius:14px;overflow:hidden;
  aspect-ratio:16/7;background:rgba(11,11,12,.14)}
.panel figure canvas{width:100%;height:100%;display:block}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,8,9,.6);
  opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s linear .4s}
.scrim.on{opacity:1;visibility:visible;transition-delay:0s}

@media (prefers-reduced-motion:reduce){
  .ent,.ent .fant,.panel,.scrim{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="marco">

  <header class="cab">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="sello">T</div>
      <div class="est"><i></i>Número 07 · en circulación</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <h1>Tendido<br><span>revista de moda</span></h1>
      <p>Cinco entradas por número. Ni una más, para que todas se lean.</p>
      <a class="correo" href="#suscribir">Suscribirse al 08</a>
    </div>
  </header>

  <nav class="indice" id="indice" aria-label="Índice del número"></nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptit" tabindex="-1"></section>

<script>
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Cada entrada trae su color y decide si el panel va con texto claro
   u oscuro: un color pleno con el texto equivocado encima es ilegible,
   y eso no se puede dejar a la suerte de cada tarjeta. */
const NUMERO = [
  {n:'01', seccion:'Portada',  tit:'La ropa que sobrevive <em>a su temporada</em>',
   tono:'#7b5cff', claro:true, formas:'orbitas',
   bloques:[['Hilo','Lo que dura','Seis talleres que todavía rematan a mano y por qué sus prendas vuelven a venderse de segunda.'],
            ['Molde','Patrones viejos','El archivo de patronaje de los años sesenta que un taller de Itagüí digitalizó entero.'],
            ['Color','Teñido natural','Achiote, cáscara de cebolla y añil. Lo que se destiñe, y lo que no.']]},
  {n:'02', seccion:'Retrato',  tit:'Diez años cosiendo <em>para nadie en particular</em>',
   tono:'#d8b48c', claro:false, formas:'rejilla',
   bloques:[['Perfil','Marta Ocampo','Hace abrigos por encargo y no tiene vitrina. La lista de espera va en catorce meses.'],
            ['Taller','Una pieza a la vez','Por qué se niega a contratar y qué le ha costado esa decisión.'],
            ['Precio','Lo que vale','La conversación incómoda sobre cuánto cuesta un abrigo hecho bien.']]},
  {n:'03', seccion:'Materia',  tit:'El algodón <em>que nadie quiere</em>',
   tono:'#1f6b4a', claro:true, formas:'tallos',
   bloques:[['Campo','Cesar y Córdoba','Lo que queda del algodón colombiano, contado por quien todavía lo siembra.'],
            ['Fibra','Corta y gruesa','Por qué la industria la descartó y qué marcas están volviendo a ella.']]},
  {n:'04', seccion:'Archivo',  tit:'Lo que se puso Medellín <em>en 1994</em>',
   tono:'#ff4d4d', claro:true, formas:'confeti',
   bloques:[['Calle','Junín','Fotografías de archivo de la que fue la vitrina de la ciudad.'],
            ['Marca','Las que ya no están','Nombres que vestían a medio país y desaparecieron en una década.'],
            ['Vuelta','Qué regresó','Tres siluetas de entonces que hoy se venden como novedad.']]},
  {n:'05', seccion:'Al cierre',tit:'Cartas, erratas <em>y una disculpa</em>',
   tono:'#cfe3ff', claro:false, formas:'lineas',
   bloques:[['Correo','Lo que nos escribieron','Las respuestas al número 06, incluidas las que no nos gustaron.'],
            ['Errata','Nos equivocamos','El taller de la página 34 no queda en Envigado. Queda en Sabaneta.']]}
];

/* ── el índice ─────────────────────────────────────────────── */
const indice = document.getElementById('indice');
indice.innerHTML = NUMERO.map((e,i)=>`
  <button class="ent" style="--tono:${e.tono}" data-i="${i}" aria-haspopup="dialog">
    <span class="fant" aria-hidden="true">${e.n}</span>
    <small>${e.seccion}</small>
    <b>${e.tit.replace(/<\/?em>/g,'')}</b>
  </button>`).join('');

/* ── el panel ──────────────────────────────────────────────── */
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
let abridor=null;

function abre(i){
  const e=NUMERO[i];
  panel.style.setProperty('--tono', e.tono);
  panel.classList.toggle('claro', !!e.claro);
  panel.innerHTML = `
    <button class="volver" type="button" data-cerrar>← Volver al índice</button>
    <div class="et">${e.n} · ${e.seccion}</div>
    <h2 id="ptit">${e.tit}</h2>
    <div class="rejilla">
      ${e.bloques.map(([i2,t,d])=>`<div><i>${i2}</i><h3>${t}</h3><p>${d}</p></div>`).join('')}
    </div>
    <figure><canvas></canvas></figure>`;
  figura(panel.querySelector('canvas'), e.formas, e.claro);
  scrim.classList.add('on'); panel.classList.add('on');
  abridor = document.activeElement;
  panel.focus({preventScroll:true});
  document.body.style.overflow='hidden';
}
function cierra(){
  panel.classList.remove('on'); scrim.classList.remove('on');
  document.body.style.overflow='';
  if(abridor) abridor.focus({preventScroll:true});   // vuelve de donde salió
}
indice.addEventListener('click', e=>{
  const b=e.target.closest('.ent'); if(b) abre(+b.dataset.i);
});
panel.addEventListener('click', e=>{ if(e.target.closest('[data-cerrar]')) cierra(); });
scrim.addEventListener('click', cierra);
addEventListener('keydown', e=>{ if(e.key==='Escape' && panel.classList.contains('on')) cierra(); });

/* ── LA FIGURA ─────────────────────────────────────────────────
   Cinco geometrías distintas, una por sección, y cada una se dibuja
   con azar en la posición pero nunca en la estructura: así cada
   lectura es irrepetible sin que ninguna salga mal compuesta. */
function figura(cv, tipo, claro){
  const g=cv.getContext('2d'), d=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth||800, h=cv.clientHeight||350;
  cv.width=w*d; cv.height=h*d; g.setTransform(d,0,0,d,0,0);
  const tinta = claro ? 'rgba(246,246,248,' : 'rgba(11,11,12,';
  g.lineCap='round';

  if(tipo==='orbitas'){
    for(let i=0;i<9;i++){
      const r=h*(0.12+i*0.09), cx=w*(0.3+Math.random()*0.42), cy=h*0.5;
      g.strokeStyle=tinta+(0.1+Math.random()*0.22)+')'; g.lineWidth=1+Math.random()*2.4;
      g.beginPath(); g.ellipse(cx,cy,r*1.6,r,Math.random()*3.14,0,7); g.stroke();
    }
  } else if(tipo==='rejilla'){
    const c=16, f=7;
    for(let i=0;i<c;i++) for(let j=0;j<f;j++){
      if(Math.random()<0.42) continue;
      g.fillStyle=tinta+(0.06+Math.random()*0.3)+')';
      const pw=w/c, ph=h/f;
      g.fillRect(i*pw+1, j*ph+1, pw-2, ph-2);
    }
  } else if(tipo==='tallos'){
    for(let i=0;i<34;i++){
      const x=Math.random()*w, alto=h*(0.25+Math.random()*0.7);
      g.strokeStyle=tinta+(0.14+Math.random()*0.3)+')'; g.lineWidth=1+Math.random()*2.6;
      g.beginPath(); g.moveTo(x,h);
      g.quadraticCurveTo(x+(Math.random()-0.5)*70, h-alto*0.6, x+(Math.random()-0.5)*48, h-alto);
      g.stroke();
    }
  } else if(tipo==='confeti'){
    for(let i=0;i<40;i++){
      const x=Math.random()*w, y=Math.random()*h, s=5+Math.random()*26;
      g.save(); g.translate(x,y); g.rotate(Math.random()*3.14);
      g.fillStyle=tinta+(0.1+Math.random()*0.32)+')';
      if(Math.random()<0.5) g.fillRect(-s/2,-s/6,s,s/3);
      else { g.beginPath(); g.arc(0,0,s/2.6,0,7); g.fill(); }
      g.restore();
    }
  } else { /* lineas */
    for(let i=0;i<22;i++){
      const y=h*(i+0.5)/22;
      g.strokeStyle=tinta+(0.08+Math.random()*0.26)+')'; g.lineWidth=1+Math.random()*2;
      g.beginPath(); g.moveTo(w*Math.random()*0.3, y);
      g.lineTo(w*(0.45+Math.random()*0.55), y); g.stroke();
    }
  }
}
</script>
</body>
</html>
