<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Galaxia LQS — Ecosistema creativo</title>
<meta name="description" content="LQS es un ecosistema creativo en Medellín: hoteles (Aloja), restaurantes (Carta), joyería (Mercury), ropa (foma), diseño exprés, creadores, empresas y productora. Explora la galaxia." />
<meta name="theme-color" content="#05060f" />
<meta property="og:title" content="Galaxia LQS — Ecosistema creativo" />
<meta property="og:description" content="Una galaxia de marcas y servicios: explora cada planeta del universo LQS." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --ink:#eaf0ff; --dim:#8b93c2; --faint:#565d8c;
  --line:rgba(180,200,255,.14); --line2:rgba(180,200,255,.26);
  --neon:#57e0ff; --gold:#e6c877;
  --pix:'Press Start 2P',monospace; --sans:'Manrope',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body.listmode{overflow:auto}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
canvas#game{position:fixed;inset:0;z-index:1;display:block;touch-action:pan-y}
body.listmode canvas#game{display:none}
#splash{position:fixed;inset:0;z-index:90;background:#05060f;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#splash.done{opacity:0;visibility:hidden}
#splash .sp-in{text-align:center}
#splash .sp-logo{font-family:var(--pix);font-size:1.6rem;letter-spacing:.1em;background:linear-gradient(90deg,#ff5d5d,#ffc93c,#35d0e6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px;animation:spGlow 1.2s steps(6) infinite}
#splash .sp-bar{width:180px;height:8px;border:1px solid var(--line2);border-radius:2px;margin:0 auto 12px;overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5d5d,#ffc93c,#35d0e6);animation:spFill 1.1s steps(9) forwards}
#splash .sp-txt{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
@keyframes spFill{to{width:100%}}
@keyframes spGlow{50%{filter:brightness(1.35)}}
@media(prefers-reduced-motion:reduce){#splash .sp-bar i{animation-duration:.2s}}
#shipSprite{position:fixed;left:-200px;top:-200px;width:100px;z-index:8;pointer-events:none;image-rendering:pixelated;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(255,110,90,.5));will-change:left,top,transform}
body.listmode #shipSprite{display:none}
/* subtle scanlines / vignette for retro feel */
.crt{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,10,.75))}
body.listmode .crt,body.listmode .vig{display:none}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:10;pointer-events:none}
.hud .in{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,4vw,34px)}
.hud button,.hud a{pointer-events:auto}
.badge-lqs{display:flex;align-items:center;gap:10px;pointer-events:auto;background:none;border:none;color:var(--ink)}
.badge-lqs .sq{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#f0d9a0,#c9a24f);display:grid;place-items:center;color:#20180a;font-family:var(--pix);font-size:12px;box-shadow:0 0 18px rgba(230,200,119,.5)}
.badge-lqs b{font-family:var(--pix);font-size:.72rem;letter-spacing:.02em}
.badge-lqs small{display:block;font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:4px;font-family:var(--sans)}
.hgroup{display:flex;gap:8px}
.hbtn{height:40px;padding:0 15px;border-radius:12px;border:1px solid rgba(185,205,255,.35);background:linear-gradient(160deg,rgba(30,36,60,.85),rgba(10,13,26,.9));color:var(--ink);font-weight:800;font-size:.78rem;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(8px);transition:.2s;box-shadow:0 8px 24px -12px #000}
.hbtn:hover{border-color:var(--neon);color:var(--neon)}
.hbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
@media(max-width:600px){.hbtn{height:44px;padding:0 14px;font-size:.82rem}}
.hbtn:hover{border-color:var(--neon);color:var(--neon)}
.hbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.title-tag{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9;text-align:center;pointer-events:none;width:92%}
#logo{image-rendering:pixelated;width:min(184px,54vw);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.title-tag p{font-size:.82rem;color:var(--dim);margin-top:10px}
body.focusmode .title-tag{opacity:0;transition:.3s}
body.listmode .title-tag{display:none}

/* carousel controls */
.controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:14px;pointer-events:auto}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,14,30,.6);color:var(--ink);font-size:1.2rem;display:grid;place-items:center;backdrop-filter:blur(6px);transition:.2s}
.arrow:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 18px rgba(87,224,255,.3)}
.dots{display:flex;gap:7px}
.dot{width:9px;height:9px;border-radius:2px;background:var(--line2);transition:.25s}
.dot.on{width:22px;background:var(--pc,var(--neon))}
body.listmode .controls,body.focusmode .controls{display:none}
.side-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:14;width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(185,205,255,.42);background:linear-gradient(160deg,rgba(32,38,64,.92),rgba(9,12,24,.94));color:#eef3ff;display:grid;place-items:center;backdrop-filter:blur(9px);transition:.2s;pointer-events:auto;box-shadow:0 14px 36px -10px #000,inset 0 1px 0 rgba(255,255,255,.14);animation:sarPulse 3.2s ease-in-out infinite}
.side-arrow.l{left:24px}.side-arrow.r{right:24px}
.side-arrow svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.side-arrow:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 28px rgba(87,224,255,.4);transform:translateY(-50%) scale(1.09)}
.side-arrow:active{transform:translateY(-50%) scale(.94)}
@keyframes sarPulse{50%{box-shadow:0 0 24px rgba(87,224,255,.22)}}
body.listmode .side-arrow,body.focusmode .side-arrow{display:none}
@media(max-width:640px){.side-arrow{width:46px;height:46px;top:44%}.side-arrow.l{left:9px}.side-arrow.r{right:9px}}

/* info card (adapts to planet) */
.card{position:fixed;z-index:20;right:18px;bottom:18px;transform:translateY(170%);width:min(330px,92vw);
  background:var(--c-bg,rgba(12,16,32,.94));backdrop-filter:blur(10px);border:1px solid var(--c-line,var(--line2));border-radius:18px;overflow:hidden;transition:transform .55s cubic-bezier(.16,1,.3,1);box-shadow:0 26px 66px -26px #000}
body.focusmode .card{transform:translateY(0)}
.card .cbar{height:6px;background:var(--c-grad,linear-gradient(90deg,#555,#222))}
.card .cin{padding:18px 20px}
.card .crow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card .cpx{width:44px;height:44px;border-radius:11px;background:var(--c-accent,#888);display:grid;place-items:center;color:#06060f;font-family:var(--pix);font-size:14px;box-shadow:0 0 20px -4px var(--c-accent,#888)}
.card h3{font-family:var(--pix);font-size:.95rem;line-height:1.2}
.card .lab{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c-accent,#aaa);font-weight:700;margin-top:5px;font-family:var(--sans)}
.card p{color:var(--dim);font-size:.9rem;line-height:1.5;margin-bottom:12px}
.card .svcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.card .svc{font-size:.72rem;color:var(--ink);border:1px solid var(--c-line,var(--line2));padding:5px 10px;border-radius:20px;opacity:0;transform:translateY(8px);animation:svcIn .4s forwards}
@keyframes svcIn{to{opacity:1;transform:none}}
.card .cta{display:flex;gap:10px}
.card .go{flex:1;height:48px;border-radius:13px;border:none;background:var(--c-accent,#888);color:#06060f;font-weight:800;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.card .go:hover{filter:brightness(1.08);transform:translateY(-1px)}
.card .go.soon{background:transparent;color:var(--c-accent,#888);border:1px solid var(--c-accent,#888)}
.card .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.card .back{flex:0 0 auto;padding:0 16px;border-radius:13px;border:1px solid var(--line2);background:transparent;color:var(--dim);font-weight:700}

.hint{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:9;color:var(--faint);font-size:.72rem;font-family:var(--sans);pointer-events:none}
body.listmode .hint,body.focusmode .hint{display:none}

/* estudio overlay (reuse) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,12,.66);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.35s}
.scrim.open{opacity:1;visibility:visible}
.estudio{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);width:min(880px,94vw);max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,#0e1122,#080a14);border:1px solid var(--line2);border-radius:22px;opacity:0;visibility:hidden;transition:.45s cubic-bezier(.16,1,.3,1)}
.estudio.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.estudio .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:rgba(0,0,0,.4);color:var(--ink);display:grid;place-items:center}
.estudio .x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.eh{text-align:center;padding:38px 26px 22px;background:radial-gradient(500px 220px at 50% -10%,rgba(230,200,119,.14),transparent 60%)}
.eh .lg{width:58px;height:58px;border-radius:15px;margin:0 auto 14px;background:linear-gradient(135deg,#f0d9a0,#c9a24f);display:grid;place-items:center;color:#20180a;font-family:var(--pix);font-size:16px;box-shadow:0 0 34px rgba(230,200,119,.4)}
.eh .k{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.eh h2{font-family:var(--pix);font-size:1.1rem;line-height:1.5;margin:10px 0}
.eh p{color:var(--dim);max-width:54ch;margin:0 auto;font-size:.95rem}
.eramas{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:20px 24px}
.erama{border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--rc)}
.erama h4{font-family:var(--sans);font-weight:800;font-size:1.05rem}
.erama h4 small{display:block;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.echip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);font-size:.78rem;font-weight:600}
.echip:hover{border-color:var(--cc);color:#fff}
.echip .d{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.econtact{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:6px 24px 26px;border-top:1px solid var(--line);margin-top:4px}
.econtact a{padding:10px 16px;border-radius:22px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:7px}
.econtact a.wa{background:#25d366;color:#04371f}
.econtact a.ln{border:1px solid var(--line2);color:var(--ink)}
.econtact a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
@media(max-width:700px){.eramas{grid-template-columns:1fr}}

/* ===== INTERIOR DE LA NAVE ===== */
.ship{position:fixed;inset:0;z-index:42;background:radial-gradient(circle at 50% 38%,#0c1024,#05060f 75%);opacity:0;visibility:hidden;transition:.45s;display:flex;flex-direction:column}
.ship.open{opacity:1;visibility:visible}
.ship-top{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,4vw,30px);z-index:6}
.ship-top .st{font-family:var(--pix);font-size:.66rem;color:var(--gold)}
.ship-x{height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line2);background:rgba(10,14,30,.6);color:var(--ink);font-weight:700;font-size:.78rem;display:inline-flex;align-items:center;gap:6px}
.ship-x:hover{border-color:var(--neon);color:var(--neon)}
.ship-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
.ship-inner{position:relative;width:min(86vmin,820px);aspect-ratio:1;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.ship-inner img{width:100%;height:100%;image-rendering:pixelated;border-radius:14px;box-shadow:0 30px 90px -30px #000;pointer-events:none}
.ship-stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.hot{position:absolute;border:2px solid rgba(87,224,255,0);border-radius:12px;background:transparent;cursor:pointer;transition:.25s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
.hot::before{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:0 0 0 0 rgba(87,224,255,.4);animation:hotpulse 2.6s ease-in-out infinite}
@keyframes hotpulse{50%{box-shadow:0 0 0 3px rgba(87,224,255,.25)}}
.hot span{font-family:var(--sans);font-weight:800;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:20px;opacity:0;transform:translateY(6px);transition:.25s}
.hot:hover{border-color:var(--neon);background:rgba(87,224,255,.12);box-shadow:0 0 26px rgba(87,224,255,.35)}
.hot:hover span,.hot:focus-visible span{opacity:1;transform:none}
.ship.zoomed .hot{opacity:0;pointer-events:none}
.ship-hint{text-align:center;padding:12px 12px 18px;color:var(--faint);font-size:.78rem}
.ship.zoomed .ship-hint{opacity:0}
.ship-panel{position:fixed;right:18px;bottom:18px;width:min(320px,92vw);background:var(--sp-bg,rgba(11,15,30,.94));border:1px solid var(--sp-accent,var(--line2));border-radius:16px;backdrop-filter:blur(10px);transform:translateY(160%);transition:.5s cubic-bezier(.16,1,.3,1);z-index:8;padding:15px 17px 17px;max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:9px;box-shadow:0 24px 60px -24px #000}
.ship.zoomed .ship-panel{transform:none}
/* personitas dentro de la nave */
.dude{position:absolute;transform:translate(-50%,-100%);z-index:3;pointer-events:none;animation:dhop var(--dh,1.5s) ease-in-out infinite;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.dude i,.dude b{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated}
.dude i{width:7px;height:7px;background:var(--dc);top:0;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 6px rgba(255,255,255,.25)}
.dude b{width:11px;height:9px;background:var(--dc);top:7px;border-radius:1px;filter:brightness(.82);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.dude::after{content:"";position:absolute;left:50%;top:14px;width:11px;height:3px;background:rgba(0,0,0,.4);border-radius:50%;transform:translateX(-50%)}
@keyframes dhop{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-121%)}}
.sp-bar{height:5px;border-radius:5px;background:var(--sp-grad,#57e0ff)}
.sp-back{align-self:flex-start;background:none;border:1px solid var(--line2);color:var(--dim);border-radius:20px;padding:8px 14px;font-weight:700;font-size:.78rem}
.sp-back:hover{border-color:var(--neon);color:var(--neon)}
.sp-content .k{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sp-accent,#57e0ff);font-weight:700}
.sp-content h3{font-family:var(--pix);font-size:1rem;line-height:1.4;margin:8px 0 12px}
.sp-content p{color:var(--dim);font-size:.95rem;line-height:1.55;margin-bottom:12px}
.sp-links{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.sp-link{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line2);border-radius:13px;background:rgba(255,255,255,.03);transition:.2s}
.sp-link:hover{border-color:var(--sp-accent,#57e0ff);transform:translateX(3px)}
.sp-link .i{width:34px;height:34px;border-radius:9px;background:var(--sp-accent,#57e0ff);display:grid;place-items:center;color:#06060f;flex:none}
.sp-link .i svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.sp-link b{font-size:.9rem;display:block}
.sp-link small{color:var(--dim);font-size:.76rem}
/* bordes más redondeados y suaves */
.card{border-radius:22px}
.iso-tab{border-radius:22px}
.ship-panel{border-radius:22px}
.iso-tab .go,.card .go,.card .back{border-radius:15px}
.sp-link{border-radius:15px}
.svc{border-radius:11px}
/* ===== pestañas tipo pantalla 8-bit (vivas, con barrido en 8 pasos) ===== */
.card{--scr:var(--c-accent,#57e0ff)} .iso-tab{--scr:#e0614a}
.iso-tab::before{animation-duration:1.6s}
.ship-panel::before{animation-duration:2.7s}
.iso-tab::after{animation-duration:4.1s}
.ship-panel::after{animation-duration:6.2s} .ship-panel{--scr:var(--sp-accent,#57e0ff)}
.card,.iso-tab,.ship-panel{overflow:hidden}
.iso-side.l{--scr:var(--iso-acc,#57e0ff)}.iso-side.r{--scr:var(--iso-acc,#57e0ff)}
.card::after,.iso-tab::after,.ship-panel::after,.iso-side::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(150,170,210,.06) 0 2px,transparent 2px 4px),linear-gradient(180deg,transparent 0,rgba(255,255,255,.07) 50%,transparent 100%);background-size:100% 100%,100% 44px;background-repeat:no-repeat;animation:scrscan 5.3s ease-in-out infinite}
.card::before,.iso-tab::before,.ship-panel::before,.iso-side::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;border:2px solid var(--scr,#57e0ff);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 0 16px -3px var(--scr,#57e0ff);animation:scrpulse 2.1s steps(6) infinite}
@keyframes scrpulse{0%{opacity:.32}9%{opacity:.7}11%{opacity:.36}13%{opacity:.74}30%{opacity:.44}31%{opacity:.66}33%{opacity:.4}58%{opacity:.6}60%{opacity:.3}61%{opacity:.7}86%{opacity:.5}88%{opacity:.34}100%{opacity:.56}}
@keyframes scrscan{0%,46%{background-position:0 0,0 -70px}52%{background-position:0 0,0 130%}54%,72%{background-position:0 0,0 -70px}78%{background-position:0 0,0 130%}80%,100%{background-position:0 0,0 -70px}}
@media(prefers-reduced-motion:reduce){.card::before,.iso-tab::before,.ship-panel::before,.card::after,.iso-tab::after,.ship-panel::after{animation:none}}

/* ===== ESCENA ISOMÉTRICA (Carta) ===== */
.iso{position:fixed;inset:0;z-index:44;background:radial-gradient(circle at 50% 32%,#2a140f,#0a0508 78%);opacity:0;visibility:hidden;transform:scale(.34);transform-origin:50% 47%;transition:opacity .55s ease,transform .85s cubic-bezier(.2,1,.32,1),visibility .85s}
.iso.open{opacity:1;visibility:visible;transform:scale(1)}
.iso canvas{position:absolute;inset:0;width:100%;height:100%}
.iso-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,4vw,30px);z-index:3}
.iso-top .st{font-family:var(--pix);font-size:.64rem;color:#ffcaa0}
.iso-tab{position:absolute;right:18px;bottom:18px;width:min(320px,92vw);background:rgba(22,11,8,.94);border:1px solid rgba(224,97,74,.55);border-radius:16px;backdrop-filter:blur(9px);padding:14px 16px 16px;z-index:3;box-shadow:0 24px 60px -24px #000;transform:translateY(170%);transition:.55s cubic-bezier(.16,1,.3,1)}
.iso.open .iso-tab{transform:none;transition-delay:.35s}
.iso-tab .k{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#e0614a;margin-bottom:4px}
.iso-tab h3{font-family:var(--pix);font-size:.85rem;line-height:1.4;margin-bottom:6px}
.iso-tab p{color:var(--dim);font-size:.85rem;margin-bottom:12px}
.iso-tab .go{width:100%;height:46px;border-radius:12px;border:none;background:linear-gradient(135deg,#f0795f,#c0392b);color:#fff;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:8px}
.iso-tab .go:hover{filter:brightness(1.07)}
.iso-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:3;color:#d8c2b8;font-size:.78rem;text-align:center}
.iso-side{position:absolute;top:50%;transform:translateY(-50%);width:min(238px,25vw);z-index:3;background:rgba(14,12,20,.82);border:1px solid var(--scr,#57e0ff);border-radius:22px;backdrop-filter:blur(9px);padding:18px 18px 20px;box-shadow:0 24px 60px -26px #000;overflow:hidden}
.iso-side.l{left:20px} .iso-side.r{right:20px}
.iso-side .k{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--scr,#57e0ff);margin-bottom:6px}
.iso-side h3{font-family:var(--pix);font-size:.82rem;line-height:1.5;margin-bottom:10px}
.iso-side .pill{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.05em;padding:4px 10px;border-radius:20px;border:1px solid var(--scr,#57e0ff);color:var(--scr,#57e0ff);margin-bottom:10px}
.iso-side p{color:var(--dim);font-size:.85rem;line-height:1.55;margin-bottom:10px}
.iso-side .act{font-size:.78rem;color:#eee;background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px;line-height:1.4}
.iso-side .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.iso-side .chips span{font-size:.72rem;font-weight:700;color:#eef3ff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:6px 10px}
.iso-side .go{width:100%;min-height:46px;border-radius:15px;border:none;font-weight:800;font-size:.8rem;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;text-align:center}
.iso-side .go svg{width:18px;height:18px}
.iso-tab{display:none!important}
@media(max-width:900px){.iso-side{display:none}.iso-tab{display:block!important}}

/* warp */
.warp{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle at 50% 50%,#fff 0%,var(--wc,#57e0ff) 20%,#05060f 72%)}
.warpfx{position:fixed;inset:0;z-index:43;pointer-events:none;opacity:1;visibility:hidden}
.warpfx.go{visibility:visible}
.warpfx i{position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg at 50% 47%,transparent 0 1.5deg,var(--wc,#57e0ff) 1.5deg 2deg);-webkit-mask:radial-gradient(circle at 50% 47%,transparent 26%,#000 58%);mask:radial-gradient(circle at 50% 47%,transparent 26%,#000 58%);opacity:0;transform:scale(.3)}
.warpfx b{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,#fff,var(--wc,#57e0ff) 28%,transparent 60%);opacity:0}
.warpfx.go i{animation:wfxStreak .82s ease-in forwards}
.warpfx.go b{animation:wfxFlash .82s ease-out forwards}
@keyframes wfxStreak{0%{opacity:0;transform:scale(.35) rotate(0)}26%{opacity:.38}100%{opacity:0;transform:scale(2.5) rotate(10deg)}}
@keyframes wfxFlash{0%,58%{opacity:0}74%{opacity:.5}100%{opacity:0}}
#usHint{position:fixed;left:-200px;top:-200px;transform:translateY(-50%);z-index:9;pointer-events:auto;cursor:pointer;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800;white-space:nowrap;text-shadow:0 0 8px rgba(0,0,0,.6);transition:color .2s}
#usHint:hover{color:var(--neon)}
body.listmode #usHint,body.focusmode #usHint{display:none}
@media(prefers-reduced-motion:reduce){.warpfx.go i,.warpfx.go b{animation-duration:.15s}}
.gate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,rgba(22,18,38,.92),rgba(4,5,12,.97));backdrop-filter:blur(7px);transition:opacity .5s,visibility .5s;padding:16px}
.gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-card{width:min(360px,94vw);background:rgba(14,14,24,.96);border:1px solid var(--line2);border-radius:26px;padding:20px 22px 24px;text-align:center;box-shadow:0 30px 90px -30px #000}
#gateDuck{image-rendering:pixelated;width:118px;height:118px;margin-top:-4px}
.gate-bubble{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;font-size:.9rem;line-height:1.55;margin:4px 0 18px;color:var(--ink)}
.gate-bubble b{color:var(--gold)}
.gate-main,.gate-reg{display:flex;flex-direction:column;gap:10px}
.gbtn{height:47px;border-radius:15px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--ink);font-weight:800;font-size:.92rem;cursor:pointer;transition:.2s;font-family:inherit}
.gbtn:hover{border-color:var(--neon);color:var(--neon)}
.gbtn.primary{background:linear-gradient(135deg,#f0d9a0,#c9a24f);color:#20180a;border:none}
.gbtn.primary:hover{filter:brightness(1.07);color:#20180a}
.gbtn.ghost{background:none;color:var(--dim)}
#regName{height:47px;border-radius:15px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);padding:0 15px;font-size:.95rem;font-family:inherit;text-align:center}
#regName:focus{outline:none;border-color:var(--neon)}
.swatches{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:2px 0 4px}
.swatches .sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.swatches .sw.on{border-color:#fff;transform:scale(1.14)}
.gate-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:71;background:rgba(14,14,24,.96);border:1px solid var(--gold);border-radius:14px;padding:12px 18px;font-weight:700;font-size:.86rem;opacity:0;visibility:hidden;transition:.4s}
.gate-toast.show{opacity:1;visibility:visible}
.warp.go{visibility:visible;animation:warp 1s cubic-bezier(.6,0,.4,1) forwards}
.warp .wt{position:absolute;bottom:20%;left:0;right:0;text-align:center;font-family:var(--pix);font-size:.9rem;color:#fff;opacity:0;animation:wt 1s ease forwards}
@keyframes warp{0%{opacity:0;transform:scale(.15)}22%{opacity:1}100%{opacity:1;transform:scale(3.4)}}
@keyframes wt{0%,45%{opacity:0}72%{opacity:1}100%{opacity:0}}

/* list mode */
.listv{display:none;position:relative;z-index:5;max-width:1080px;margin:0 auto;padding:88px clamp(16px,5vw,36px) 60px}
body.listmode .listv{display:block}
.listv h1{font-family:var(--pix);font-size:1.2rem;text-align:center;line-height:1.5}
.listv .sub{text-align:center;color:var(--dim);margin:10px 0 24px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.lc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03);transition:.25s}
.lc:hover{transform:translateY(-4px);border-color:var(--line2)}
.lc .t{height:72px;display:flex;align-items:center;gap:11px;padding:0 15px;background:var(--g)}
.lc .t .p{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-family:var(--pix);font-size:12px}
.lc .t b{font-family:var(--pix);font-size:.8rem;color:#fff}
.lc .b{padding:13px 15px}
.lc .b .l{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pc)}
.lc .b p{color:var(--dim);font-size:.84rem;margin:5px 0 9px}
.lc .b .st{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);padding:3px 9px;border-radius:20px}

@media(max-width:600px){.title-tag{top:58px}.title-tag p{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

<script>
const WA='573332791710';
function waMsg(t){window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(t),'_blank');}

/* ===== UNIVERSOS ===== */
const U={
 aloja:{name:'Aloja',label:'Hoteles',pal:['#bff0e6','#2fb8a3','#0c5347'],type:'gas',accent:'#2fb8a3',
   tag:'Plataforma hotelera todo-en-uno con tu marca.',svc:['Reservas directas','Check-in QR','Llave digital','WhatsApp'],
   status:'live',url:'https://motta-bit.github.io/Vita-Nova/',mob:'🛎️'},
 carta:{name:'Carta',label:'Restaurantes',pal:['#ffd8ce','#e0614a','#6e2216'],type:'rock',accent:'#e0614a',
   tag:'Menú digital interactivo con pedido por WhatsApp.',svc:['Menú digital','Pedido WhatsApp','Fotografía','QR de mesa'],
   status:'live',url:'https://motta-bit.github.io/vitanova/',mob:'🍽️'},
 mercury:{name:'Mercury',label:'Joyería',pal:['#ffe1ec','#d98aa6','#7a3b53'],type:'ring',accent:'#d98aa6',
   tag:'Joyería con alma — marca propia de LQS.',svc:['Joyería de autor','Por encargo','Marca propia'],status:'soon',url:'mundos/mercury.html',mob:'💎'},
 foma:{name:'foma',label:'Ropa',pal:['#f3efe6','#cfc7b6','#5a5346'],type:'rock',accent:'#b6ad98',
   tag:'Indumentaria de autor — marca propia de LQS.',svc:['Colecciones','Diseño de autor','Marca propia'],status:'soon',url:'mundos/foma.html',mob:'👕'},
 express:{name:'Express',label:'Diseño día a día',pal:['#c9f5df','#39c07a','#155e3a'],type:'gas',accent:'#39c07a',
   tag:'Diseño económico y rápido, por medida y urgencia.',svc:['Flyers','Tarjetas','Posts','Logo básico'],status:'soon',url:'mundos/express.html',mob:'⚡'},
 creadores:{name:'Creadores',label:'Creadores',pal:['#e8dcfa','#a97bd6','#4a2f6b'],type:'ice',accent:'#a97bd6',
   tag:'Marca personal y contenido para creadores.',svc:['Marca personal','Kits visuales','Contenido'],status:'soon',url:'mundos/creadores.html',mob:'🎬'},
 empresas:{name:'Empresas',label:'Empresas',pal:['#d6e3ff','#5b8def','#1f3f7a'],type:'gas',accent:'#5b8def',
   tag:'Branding, web y automatización para empresas.',svc:['Branding','Web','Automatización'],status:'soon',url:'mundos/empresas.html',mob:'🏢'},
 productora:{name:'Productora',label:'Audiovisual',pal:['#cdf3f8','#3fc6d6','#155e6b'],type:'ring',accent:'#3fc6d6',
   tag:'Video, foto y contenido — la productora de LQS.',svc:['Video','Foto','Contenido'],status:'soon',url:'mundos/productora.html',mob:'🎥'},
};
const ORDER=['aloja','carta','mercury','foma','express','creadores','empresas','productora'];
const NW=ORDER.length;
function wrapIdx(i){return ((i%NW)+NW)%NW;}

/* ===== CANVAS ENGINE ===== */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);buildStars();}
addEventListener('resize',resize);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* stars */
let stars=[];
function buildStars(){stars=Array.from({length:Math.min(160,Math.round(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,ph:Math.random()*6}));}

/* ===== fondo galaxia pixel ===== */
let NEB=null;
function makeNebula(){
 const w=300,hh=190,c=document.createElement('canvas');c.width=w;c.height=hh;const g=c.getContext('2d');
 g.fillStyle='#05060f';g.fillRect(0,0,w,hh);
 const blobs=[['#3a2a6a',110,60],['#1f4a6b',210,120],['#5a2a4a',80,140],['#22506a',250,50],['#2a3a7a',160,95]];
 blobs.forEach(([col,bx,by])=>{for(let i=0;i<70;i++){g.globalAlpha=0.015+Math.random()*0.045;g.fillStyle=col;const rr=8+Math.random()*40;g.beginPath();g.arc(bx+(Math.random()-.5)*120,by+(Math.random()-.5)*90,rr,0,7);g.fill();}});
 g.globalAlpha=1;
 for(let i=0;i<340;i++){const b=Math.random();g.globalAlpha=0.28+b*0.72;g.fillStyle=b>0.86?'#ffe6a0':(b>0.6?'#bcd0ff':'#8090c0');const s=b>0.94?2:1;g.fillRect((Math.random()*w)|0,(Math.random()*hh)|0,s,s);}
 g.globalAlpha=1;return c;}

/* pre-render planet textures */
function hxa(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function hsh(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function cl255(v){v=v|0;return v<0?0:v>255?255:v;}
function makePlanet(u,size){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const r=size/2,cx=r,cy=r,img=g.createImageData(size,size),D=img.data;
  const p0=hxa(u.pal[0]),p1=hxa(u.pal[1]),p2=hxa(u.pal[2]);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(x-cx)/r,dy=(y-cy)/r,dd=dx*dx+dy*dy;if(dd>1)continue;
    const nz=Math.sqrt(Math.max(0,1-dd));
    let light=(-dx*0.55-dy*0.55+nz*0.85);light=Math.max(-0.15,light);
    let mix;
    if(u.type==='gas'){const band=Math.sin((y/size)*Math.PI*7+Math.sin(x/size*4)*0.5);mix=band>0.35?0:(band<-0.35?2:1);}
    else if(u.type==='rock'){const n=hsh(x>>2,y>>2);mix=n<0.24?2:(n>0.82?0:1);}
    else if(u.type==='ice'){const n=hsh(x>>3,y>>1);mix=n<0.35?0:1;}
    else {const band=Math.sin((y/size)*Math.PI*5);mix=band>0.2?0:1;}
    const base=mix===0?p0:(mix===1?p1:p2);
    let lf=0.42+light*0.9;lf=Math.round(lf*4)/4;
    const idx=(y*size+x)*4;D[idx]=cl255(base[0]*lf);D[idx+1]=cl255(base[1]*lf);D[idx+2]=cl255(base[2]*lf);D[idx+3]=255;
  }
  g.putImageData(img,0,0);
  // brillo especular pixel (highlight arriba-izq)
  g.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<Math.round(size*0.7);i++){const a=Math.random()*6.28,rr=Math.random()*r*0.4;const px=(cx-r*0.32+Math.cos(a)*rr)|0,py=(cy-r*0.34+Math.sin(a)*rr)|0;g.fillRect(px,py,1,1);}
  return c;
}
const TEX={}; // built lazily on init

/* ===== state ===== */
let focus=0, camX=0, targetCamX=0, t=0, focusMode=false, tex=1;
let shipPos={x:0,y:0}, shipInit=false;
let sprites=[]; // pixel dudes on focused planet
const shipSpriteEl=document.getElementById('shipSprite');

function planetScreen(i){
  // aro orbital infinito: el enfocado al frente/centro, los demás curvan hacia los lados
  const N=NW; let off=((i-camX)%N+N)%N; if(off>N/2)off-=N;
  const ang=off*0.55;
  const Rx=Math.min(W*0.37,460);
  const front=Math.cos(ang);
  const x=W/2 + Math.sin(ang)*Rx;
  const y=H*0.47 - (front-1)*96 + Math.sin(t*0.7+i)*4*(reduce?0:1);
  const scale=Math.max(.30, 0.46 + Math.max(0,front)*0.54);
  const d=Math.abs(off);
  return {x,y,scale,d,off,front};
}

/* ship (UFO pixel image) */
function drawShip(x,y,s){
  const w=92*s,h=92*s;
  // glow
  ctx.save();ctx.globalAlpha=.45;const gg=ctx.createRadialGradient(x,y,6,x,y,w*.75);gg.addColorStop(0,'rgba(255,170,80,.55)');gg.addColorStop(1,'rgba(255,170,80,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,w*.75,0,7);ctx.fill();ctx.restore();
  // beam under ship
  ctx.save();ctx.globalAlpha=.5+Math.sin(t*6)*.15;const bg=ctx.createLinearGradient(0,y,0,y+h*.7);bg.addColorStop(0,'rgba(120,230,255,.5)');bg.addColorStop(1,'rgba(120,230,255,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(x-8,y+h*.2);ctx.lineTo(x+8,y+h*.2);ctx.lineTo(x+16,y+h*.7);ctx.lineTo(x-16,y+h*.7);ctx.closePath();ctx.fill();ctx.restore();
  // la nave (sprite animado) se dibuja como overlay <img>; aquí sólo el resplandor/haz del motor
}
/* pixel dude */
function drawDude(x,y,col,hop){
  ctx.save();ctx.translate(x,y-hop);
  const p=3; // pixel size
  ctx.fillStyle=col;
  ctx.fillRect(-p,-p*3,p*2,p*2);      // head
  ctx.fillRect(-p*1.5,-p,p*3,p*2);    // body
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-p*1.5,p, p*3, p*.7); // shadow row
  ctx.restore();
}

/* ===== loop ===== */
function frame(){
  t+=1/60;
  camX += (focus - camX)*0.12;
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  if(NEB)ctx.drawImage(NEB,0,Math.sin(t*0.06)*3,W,H);
  // stars
  for(const st of stars){const tw=reduce?.7:(.55+.45*Math.sin(t*2+st.ph));ctx.globalAlpha=tw*st.z;ctx.fillStyle=st.z>.8?'#e6c877':'#cdd6ff';ctx.fillRect(st.x,st.y,st.z*1.8,st.z*1.8);}
  ctx.globalAlpha=1;
  // planets sorted far->near
  const idx=ORDER.map((_,i)=>i).sort((a,b)=>planetScreen(a).front-planetScreen(b).front);
  for(const i of idx){
    const u=U[ORDER[i]], ps=planetScreen(i);
    if(ps.x<-300||ps.x>W+300)continue;
    const base=(W<640?96:120), size=base*ps.scale;
    // glow
    ctx.globalAlpha=.5*ps.scale;const gl=ctx.createRadialGradient(ps.x,ps.y,size*.3,ps.x,ps.y,size*.95);
    gl.addColorStop(0,u.accent+'88');gl.addColorStop(1,u.accent+'00');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(ps.x,ps.y,size*.95,0,7);ctx.fill();ctx.globalAlpha=1;
    // ring (behind)
    if(u.type==='ring'){ctx.save();ctx.translate(ps.x,ps.y);ctx.rotate(-.5);ctx.scale(1,.32);ctx.strokeStyle=u.pal[0]+'aa';ctx.lineWidth=size*.06;ctx.beginPath();ctx.arc(0,0,size*.72,0,7);ctx.stroke();ctx.restore();}
    // planet texture (rotating)
    ctx.save();ctx.translate(ps.x,ps.y);
    ctx.drawImage(TEX[ORDER[i]], -size/2,-size/2,size,size);
    ctx.restore();
    // outline
    ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ps.x,ps.y,size/2,0,7);ctx.stroke();
    // atmósfera (brillo del borde iluminado)
    ctx.save();ctx.globalAlpha=.55*Math.min(1,ps.scale+.15);ctx.strokeStyle=u.pal[0];ctx.lineWidth=2.4*ps.scale;ctx.beginPath();ctx.arc(ps.x,ps.y,size/2-1,Math.PI*1.02,Math.PI*1.78);ctx.stroke();ctx.restore();
    // luna para algunos planetas
    if(i%3===0){const ma=t*0.5+i*2;const mx=ps.x+Math.cos(ma)*size*0.74, my=ps.y+Math.sin(ma)*size*0.42;ctx.globalAlpha=.9*ps.scale;ctx.fillStyle='#cfd6ea';ctx.beginPath();ctx.arc(mx,my,size*0.055,0,7);ctx.fill();ctx.globalAlpha=1;}
    // ring front half
    if(u.type==='ring'){ctx.save();ctx.translate(ps.x,ps.y);ctx.rotate(-.5);ctx.scale(1,.32);ctx.strokeStyle=u.pal[0];ctx.globalAlpha=.9;ctx.lineWidth=size*.05;ctx.beginPath();ctx.arc(0,0,size*.72,0,Math.PI);ctx.stroke();ctx.restore();ctx.globalAlpha=1;}
    // label under non-focused
    if(Math.abs(ps.off)>.28 && Math.abs(ps.off)<1.7){ctx.globalAlpha=Math.max(0,.75-ps.d*.4);ctx.fillStyle='#cfd8ee';ctx.font='700 12px Manrope,sans-serif';ctx.textAlign='center';ctx.fillText(u.name,ps.x,ps.y+size/2+20);ctx.globalAlpha=1;}
    // planeta enfocado: nombre arriba con indicador discreto
    {const foc=Math.max(0,1-Math.abs(ps.off)/0.30);if(foc>0.03){const ly=ps.y-size/2-32;ctx.textAlign='center';ctx.globalAlpha=foc;
      ctx.save();ctx.shadowColor=u.accent;ctx.shadowBlur=12;ctx.fillStyle='#fff';ctx.font='800 16px Manrope,sans-serif';ctx.fillText(u.name.toUpperCase(),ps.x,ly);ctx.restore();
      ctx.globalAlpha=foc*0.9;ctx.fillStyle=u.accent;ctx.font='700 9px Manrope,sans-serif';ctx.fillText((u.status==='live'?'● EN VIVO':'○ PRÓXIMAMENTE')+' · '+u.label.toUpperCase(),ps.x,ly+14);
      ctx.globalAlpha=foc;ctx.beginPath();ctx.moveTo(ps.x-5,ly+21);ctx.lineTo(ps.x+5,ly+21);ctx.lineTo(ps.x,ly+27);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;}}
    // pixel life on the focused planet
    if(Math.abs(ps.off)<.25){
      sprites.forEach((sp,k)=>{
        const hop=reduce?0:Math.max(0,Math.sin(t*4+sp.ph))*7;
        const ang=sp.a, rr=size*0.34;
        drawDude(ps.x+Math.cos(ang)*rr*0.9, ps.y+Math.sin(ang)*rr*0.5 - size*0.12, sp.c, hop);
      });
    }
  }
  // ship: parked below focus, points up
  // nave: vuela hacia el planeta enfocado, o parquea abajo
  let tgt;
  if(focusMode){ const ps=planetScreen(Math.round(camX)); tgt={x:ps.x, y:ps.y + 120*ps.scale*0.5 + 34 + Math.sin(t*1.5)*3}; }
  else { tgt={x:W/2, y:H*0.46 + 138 + Math.sin(t*1.5)*5}; }
  if(!shipInit){ shipPos={x:tgt.x,y:tgt.y}; shipInit=true; }
  shipPos.x += (tgt.x-shipPos.x)*0.09; shipPos.y += (tgt.y-shipPos.y)*0.09;
  drawShip(shipPos.x, shipPos.y, focusMode?0.9:1.05);
  if(shipSpriteEl){const scl=focusMode?0.9:1.05;const bank=Math.max(-11,Math.min(11,(tgt.x-shipPos.x)*0.5));
    shipSpriteEl.style.left=shipPos.x+'px';shipSpriteEl.style.top=shipPos.y+'px';shipSpriteEl.style.width=(98*scl)+'px';
    shipSpriteEl.style.transform='translate(-50%,-50%) rotate('+bank.toFixed(2)+'deg)';}
  const uh=document.getElementById('usHint');if(uh){uh.style.left=(shipPos.x+50)+'px';uh.style.top=(shipPos.y+2)+'px';}
  drawLogo();
  requestAnimationFrame(frame);
}

/* ===== init ===== */
function init(){
  resize();
  NEB=makeNebula();
  ORDER.forEach(id=>TEX[id]=makePlanet(U[id],64));
  makeSprites();
  updateDots();
  buildList();
  requestAnimationFrame(frame);
}
function makeSprites(m){
  const u=U[ORDER[wrapIdx(m==null?focus:m)]];
  sprites=Array.from({length:3},(_,k)=>({a:-2.4+k*0.9+Math.random()*.3, ph:Math.random()*6, c:['#fff',u.pal[0],'#ffe08a'][k%3]}));
}

/* ===== logo pixel LQS ===== */
const logoCv=document.getElementById('logo'), lgx=logoCv.getContext('2d');
const LF={
 L:["10000","10000","10000","10000","10000","10000","11111"],
 Q:["01110","10001","10001","10001","10101","10010","01101"],
 S:["01111","10000","10000","01110","00001","00001","11110"]};
const LCOL={L:'#ff5d5d',Q:'#ffc93c',S:'#35d0e6'};
function drawLogo(){
 const g=lgx,W2=logoCv.width,H2=logoCv.height;g.clearRect(0,0,W2,H2);
 const px=9, gap=10, letters=['L','Q','S'];
 const totW=letters.length*5*px+(letters.length-1)*gap, x0=Math.round((W2-totW)/2), y0=Math.round((H2-7*px)/2);
 g.imageSmoothingEnabled=false;
 letters.forEach((ch,li)=>{const map=LF[ch],col=LCOL[ch];const lx0=x0+li*(5*px+gap);
   const bob=Math.sin(t*2+li*0.8)*1.4;
   g.save();g.shadowColor=col;g.shadowBlur=8+4*Math.sin(t*3+li);
   for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(map[r][c]==='1'){g.fillStyle=col;g.fillRect(lx0+c*px, y0+r*px+bob, px-1, px-1);}}
   g.restore();
   // brillo interior
   g.fillStyle='rgba(255,255,255,.5)';for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(map[r][c]==='1'&&Math.random()<0.04){g.fillRect(lx0+c*px, y0+r*px+bob, px-1, 2);}}
 });
}

/* ===== nav ===== */
function go(d){ setFocus(focus+d); }
function setFocus(i){ focus=i; const m=wrapIdx(i); makeSprites(m); updateDots(m); if(focusMode){renderCard(ORDER[m]);} }
function updateDots(m){m=m==null?wrapIdx(focus):m;document.getElementById('dots').innerHTML=ORDER.map((id,i)=>`<span class="dot${i===m?' on':''}" style="--pc:${U[id].accent}" onclick="setFocus(${i})"></span>`).join('');}

/* focus a planet -> zoom + card */
function enter(i){ setFocus(i); document.body.classList.add('focusmode'); renderCard(ORDER[wrapIdx(i)]); }
function exitFocus(){ document.body.classList.remove('focusmode'); }
function renderCard(id){
  const u=U[id], c=document.getElementById('card');
  c.style.setProperty('--c-accent',u.accent);
  c.style.setProperty('--c-line',u.accent+'55');
  document.getElementById('cBar').style.background=`linear-gradient(90deg,${u.pal[0]},${u.accent},${u.pal[2]})`;
  const px=document.getElementById('cPix');px.style.background=u.accent;px.textContent=u.name[0].toUpperCase();
  document.getElementById('cName').textContent=u.name;
  document.getElementById('cLab').textContent=(u.status==='live'?'● En vivo · ':'○ Próximamente · ')+u.label;
  document.getElementById('cTag').textContent=u.tag;
  document.getElementById('cSvcs').innerHTML=u.svc.map((s,i)=>`<span class="svc" style="animation-delay:${i*70}ms">${s}</span>`).join('');
  document.getElementById('cCta').innerHTML = `<button class="go" onclick="enterWorld('${id}')">Explorar mundo ${u.name} <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="back" onclick="exitFocus()">Volver</button>`;
  beep(u.status==='live'?660:440);
}
function enterWorld(id){const u=U[id];const fx=document.getElementById('warpfx');fx.style.setProperty('--wc',u.accent);fx.classList.remove('go');void fx.offsetWidth;fx.classList.add('go');beep(760);setTimeout(()=>openIso(id),reduce?40:400);setTimeout(()=>fx.classList.remove('go'),reduce?120:980);}
function jump(id){const u=U[id];const w=document.getElementById('warp');w.style.setProperty('--wc',u.accent);document.getElementById('wt').textContent='ENTRANDO A '+u.name.toUpperCase()+'…';w.classList.remove('go');void w.offsetWidth;w.classList.add('go');beep(880);setTimeout(()=>{location.href=u.url;},reduce?150:950);}

/* click canvas to enter focused planet */
cv.addEventListener('click',e=>{
  if(!focusMode && Math.hypot(e.clientX-shipPos.x, e.clientY-shipPos.y) < 62){ openShip(); return; }
  const i=Math.round(camX);
  const ps=planetScreen(i);const dx=e.clientX-ps.x,dy=e.clientY-ps.y;
  if(Math.hypot(dx,dy) < 120*ps.scale*0.6){ enter(i); }
});
/* swipe */
let sx=null;
cv.addEventListener('pointerdown',e=>sx=e.clientX);
cv.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null;});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Enter')enter(Math.round(camX));
  else if(e.key==='Escape'){const iso=document.getElementById('iso');if(iso.classList.contains('open')){closeIso();return;}const sh=document.getElementById('ship');if(sh.classList.contains('zoomed'))deckReset();else if(sh.classList.contains('open'))closeShip();else exitFocus();}
});

function drawDuck(x,y,z,sel){

 const ox=x-cols*u/2, oy=y-rows*u;

 for(let r=0;r<rows;r++){const ln=map[r];for(let cc=0;cc<cols;cc++){const ch=ln[cc];if(ch===' ')continue;dcx.fillStyle=DUCKCOL[ch]||'#fff';dcx.fillRect(Math.round(ox+cc*u),Math.round(oy+r*u),Math.ceil(u),Math.ceil(u));}}
 if(near){dcx.fillStyle='#e6c877';dcx.fillRect(ox+4*u,oy-0.2*u,4*u,1.3*u);dcx.fillStyle='#cba64f';dcx.fillRect(ox+3*u,oy+0.9*u,1.4*u,0.7*u);}
 dcx.globalAlpha=0.9;dcx.fillStyle=sel?'#fff':'#e6c877';dcx.textAlign='center';dcx.textBaseline='alphabetic';dcx.font='800 '+(9*Math.min(1.4,z))+'px Manrope,sans-serif';dcx.fillText('CAP. TO',x,oy-5);dcx.globalAlpha=1;}

 const gg=dcx.createRadialGradient(x,y,2,x,y,42*z);gg.addColorStop(0,s.acc+'aa');gg.addColorStop(1,s.acc+'00');
 dcx.fillStyle=gg;dcx.beginPath();dcx.ellipse(x,y,42*z,21*z,0,0,7);dcx.fill();
 dcx.globalAlpha=dim;
 const w=20*z,h=10*z,tall=22*z;
 dcx.fillStyle='#141a2e';dcx.beginPath();dcx.moveTo(x-w,y);dcx.lineTo(x,y+h);dcx.lineTo(x,y+h-tall);dcx.lineTo(x-w,y-tall);dcx.closePath();dcx.fill();
 dcx.fillStyle='#212a48';dcx.beginPath();dcx.moveTo(x+w,y);dcx.lineTo(x,y+h);dcx.lineTo(x,y+h-tall);dcx.lineTo(x+w,y-tall);dcx.closePath();dcx.fill();
 dcx.fillStyle='#2e3760';dcx.beginPath();dcx.moveTo(x,y-h-tall);dcx.lineTo(x+w,y-tall);dcx.lineTo(x,y+h-tall);dcx.lineTo(x-w,y-tall);dcx.closePath();dcx.fill();
 const bw=38*z,bh=28*z,by=y-tall-h*0.4;
 const grd=dcx.createLinearGradient(0,by-bh,0,by);grd.addColorStop(0,s.acc);grd.addColorStop(1,darken(s.acc,0.5));
 dcx.fillStyle=grd;dRound(dcx,x-bw/2,by-bh,bw,bh,5*z);dcx.fill();
 if(z>1.2||sel){dcx.save();dcx.globalAlpha=dim*0.45;dcx.strokeStyle='rgba(255,255,255,.55)';dcx.lineWidth=1;for(let ly=by-bh+6*z;ly<by-4*z;ly+=5*z){dcx.beginPath();dcx.moveTo(x-bw/2+5*z,ly);dcx.lineTo(x+bw/2-5*z,ly);dcx.stroke();}dcx.restore();}
 dcx.fillStyle=txtOn(s.acc);dcx.textAlign='center';dcx.textBaseline='middle';dcx.font='800 '+(15*z)+'px Manrope,sans-serif';dcx.fillText(s.glyph,x,by-bh/2);
 dcx.strokeStyle=sel?'#fff':'rgba(255,255,255,.4)';dcx.lineWidth=(sel?2.2:1)*z;dRound(dcx,x-bw/2,by-bh,bw,bh,5*z);dcx.stroke();
 dcx.globalAlpha=dim;dcx.fillStyle='#eef3ff';dcx.textBaseline='alphabetic';dcx.font='800 '+(11*Math.min(1.5,z))+'px Manrope,sans-serif';dcx.fillText(s.label,x,by-bh-9*z);
 if(!deckSel){dcx.globalAlpha=0.5+0.5*Math.max(0,Math.sin(deckT*3+s.gy));dcx.fillStyle=s.acc;dcx.font='700 9px Manrope,sans-serif';dcx.fillText('▸ TOCAR',x,y+15);}
 dcx.restore();}
function deckViewport(){
 const a=deckPt(0,0), b=deckPt(DGRID-1,0);
 const vx=(a.x+b.x)/2, top=Math.min(a.y,b.y)-150*deckZoom, ww=Math.abs(b.x-a.x)+120*deckZoom, hh=118*deckZoom;
 dcx.save();
 dcx.fillStyle='#05060f';dRound(dcx,vx-ww/2,top,ww,hh,10*deckZoom);dcx.fill();
 dcx.save();dRound(dcx,vx-ww/2,top,ww,hh,10*deckZoom);dcx.clip();
 for(let i=0;i<44;i++){const sx=vx-ww/2+((i*97)%ww),sy=top+((i*53)%hh);dcx.globalAlpha=0.35+0.55*Math.abs(Math.sin(deckT+i));dcx.fillStyle=i%5?'#cdd6ff':'#e6c877';dcx.fillRect(sx,sy,2,2);}
 dcx.globalAlpha=1;
 const pxp=vx+Math.sin(deckT*0.18)*ww*0.3, pyp=top+hh*0.62, pr=24*deckZoom;
 const pg=dcx.createRadialGradient(pxp-pr*0.3,pyp-pr*0.3,pr*0.2,pxp,pyp,pr);pg.addColorStop(0,'#8fe0cf');pg.addColorStop(1,'#0f3a34');
 dcx.fillStyle=pg;dcx.beginPath();dcx.arc(pxp,pyp,pr,0,7);dcx.fill();
 dcx.restore();
 dcx.strokeStyle='rgba(130,170,255,.5)';dcx.lineWidth=2*deckZoom;dRound(dcx,vx-ww/2,top,ww,hh,10*deckZoom);dcx.stroke();
 dcx.fillStyle='rgba(150,185,255,.55)';dcx.textAlign='center';dcx.textBaseline='alphabetic';dcx.font='700 10px Manrope,sans-serif';dcx.fillText('◈ VENTANAL · RUMBO A LA GALAXIA',vx,top-8*deckZoom);
 dcx.restore();}
function deckLoop(){deckT+=1/60;
 deckPanX+=(deckTPanX-deckPanX)*0.11;deckPanY+=(deckTPanY-deckPanY)*0.11;deckZoom+=(deckTZoom-deckZoom)*0.11;
 dcx.clearRect(0,0,dW,dH);
 deckViewport();
 for(let gy=0;gy<DGRID;gy++)for(let gx=0;gx<DGRID;gx++){const p=deckPt(gx,gy);deckDiamond(p.x,p.y,((gx+gy)%2)?'#171d36':'#12172c',deckZoom);}
 const c0=deckPt((DGRID-1)/2,(DGRID-1)/2);
 dcx.save();dcx.globalAlpha=0.3+0.14*Math.sin(deckT*2);dcx.strokeStyle='#e6c877';dcx.lineWidth=2*deckZoom;dcx.beginPath();dcx.ellipse(c0.x,c0.y,26*deckZoom,13*deckZoom,0,0,7);dcx.stroke();dcx.fillStyle='#e6c877';dcx.textAlign='center';dcx.textBaseline='middle';dcx.font='800 '+(10*deckZoom)+'px Manrope,sans-serif';dcx.globalAlpha=0.55;dcx.fillText('LQS',c0.x,c0.y);dcx.restore();
 const items=[];
 STATIONS.forEach(s=>items.push({gx:s.gx,gy:s.gy,type:'st',s}));
 crew.forEach(cr=>{if(cr.path){const nx=cr.path[(cr.pi+1)%cr.path.length];const ddx=nx[0]-cr.gx,ddy=nx[1]-cr.gy,d=Math.hypot(ddx,ddy);if(d<0.05)cr.pi=(cr.pi+1)%cr.path.length;else{cr.gx+=ddx/d*cr.spd;cr.gy+=ddy/d*cr.spd;}}items.push({gx:cr.gx,gy:cr.gy,type:'cr',cr});});
 items.sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
 items.forEach(it=>{const p=deckPt(it.gx,it.gy);if(it.type==='st')drawConsole(p.x,p.y,it.s);else{const hop=reduce?0:Math.max(0,Math.sin(deckT*6+it.gx*3))*5*deckZoom;if(it.cr.cap)drawDuck(p.x,p.y-hop,deckZoom,false);else deckPerson(p.x,p.y-hop,it.cr.c,deckZoom);}});
 deckRAF=requestAnimationFrame(deckLoop);}
function deckHit(px,py){let best=null,bd=1e9;STATIONS.forEach(s=>{const p=deckPt(s.gx,s.gy);const d=Math.hypot(px-p.x,py-(p.y-30*deckZoom));if(d<bd){bd=d;best=s;}});return bd<54*deckZoom?best:null;}

 // brillo superior
 q.save();q.beginPath();q.moveTo(cx,cy-hd-tall);q.lineTo(cx+hw,cy-tall);q.lineTo(cx,cy+hd-tall);q.lineTo(cx-hw,cy-tall);q.closePath();q.clip();

 tab.forEach(([gx,gy],i)=>{if(i>=3)return;crew.push({gx:gx-0.95,gy,c:['#ffd6c8','#bcd0ff','#ffffff'][i%3],sit:1,s:0.6});crew.push({gx:gx+0.95,gy,c:['#c9f5df','#ffe0a0','#ffd6c8'][i%3],sit:1,s:0.6});});
 for(let i=0;i<2;i++){const a=[2.4+Math.random()*3.4,3.4+Math.random()*3.2],bb=[2.4+Math.random()*3.4,3.4+Math.random()*3.2];crew.push({gx:a[0],gy:a[1],path:[a,bb,a],pi:0,spd:0.012,c:'#f3ead6',tray:1,s:0.62});}
 for(let i=0;i<2;i++){const a=[2.2+Math.random()*4,3.4+Math.random()*4.4],bb=[2.2+Math.random()*4,3.4+Math.random()*4.4];crew.push({gx:a[0],gy:a[1],path:[a,bb,a],pi:0,spd:0.009,c:['#ffffff','#ffd6c8','#bcd0ff'][i%3],s:0.58});}
 const duck={gx:4,gy:6.4,path:[[4,6.4],[2.6,5],[5.6,4.6],[4,6.4]],pi:0,wait:80,spd:0.017};
 return {props,crew,duck,slab:[4.2,-0.3,8.5,2.2,PL]};
}
function buildExpress(){
 const props=[],crew=[],PL=16;
 // --- sala de juntas (plataforma elevada, fondo derecha) ---
 props.push({gx:6.3,gy:0.5,k:'board',lift:PL});
 props.push({gx:5.2,gy:1.4,k:'desk',lift:PL});
 props.push({gx:7.4,gy:1.4,k:'desk',lift:PL});
 crew.push({gx:5.2,gy:2.2,c:'#c9f5df',sit:1,s:0.6,lift:PL});
 crew.push({gx:7.4,gy:2.2,c:'#ffffff',sit:1,s:0.6,lift:PL});
 crew.push({gx:6.3,gy:1.2,c:'#39c07a',lift:PL,path:[[6.3,1.2],[7.2,1.2],[5.4,1.2],[6.3,1.2]],pi:0,spd:0.006,s:0.6});
 // --- filas de cubículos (zona central) ---
 [2,4,6].forEach(gx=>[3.2,5].forEach(gy=>{props.push({gx,gy,k:'cubicle'});crew.push({gx:gx,gy:gy+0.75,c:['#ffffff','#c9f5df','#bcd0ff','#ffe0a0'][(gx+gy|0)%4],sit:1,s:0.58});}));
 // --- escritorios sueltos frente ---
 props.push({gx:2.6,gy:7,k:'desk'});
 props.push({gx:5.6,gy:7,k:'desk'});
 crew.push({gx:2.6,gy:7.8,c:'#ffd6c8',sit:1,s:0.58});
 // --- zona café / servicios (izquierda) ---
 props.push({gx:0.5,gy:2.4,k:'water'});
 props.push({gx:0.5,gy:4.2,k:'printer'});
 props.push({gx:0.6,gy:6.4,k:'plant'});
 props.push({gx:8.3,gy:5.4,k:'plant'});
 props.push({gx:8.3,gy:7.4,k:'plant'});
 props.push({gx:0.5,gy:0.6,k:'plant'});
 // --- paquetes listos para despachar ---
 props.push({gx:7.6,gy:7.4,k:'parcel'});
 props.push({gx:8.4,gy:6.5,k:'parcel'});
 props.push({gx:6.9,gy:8.2,k:'launchpad'});
 // --- gente circulando lento ---
 for(let i=0;i<3;i++){const a=[1.6+Math.random()*5.5,3+Math.random()*4.6],bb=[1.6+Math.random()*5.5,3+Math.random()*4.6];
  crew.push({gx:a[0],gy:a[1],path:[a,bb,a],pi:0,spd:0.008+Math.random()*0.005,c:['#ffffff','#c9f5df','#bcd0ff'][i%3],s:0.58});}
 const duck={gx:4.2,gy:7.4,path:[[4.2,7.4],[2.2,6.2],[6.6,6.4],[4.2,7.4]],pi:0,wait:80,spd:0.017};
 return {props,crew,duck,slab:[4.3,-0.4,8.6,2.6,PL]};
}
function moveDuck(d){if(!d.path)return;if(d.wait>0){d.wait--;return;}const nx=d.path[(d.pi+1)%d.path.length];const ddx=nx[0]-d.gx,ddy=nx[1]-d.gy,dd=Math.hypot(ddx,ddy);if(dd<0.05){d.pi=(d.pi+1)%d.path.length;d.wait=150;}else{d.gx+=ddx/dd*(d.spd||0.016);d.gy+=ddy/dd*(d.spd||0.016);}}
function isoLoop(){isoT+=1/60;ix.clearRect(0,0,iW,iH);
  const u=U[isoU];
  const sc=SCN[isoU]||SCN.carta;
  const fA=sc.floor?sc.floor[0]:darken(u.pal[1],0.5), fB=sc.floor?sc.floor[1]:darken(u.pal[1],0.4);
  drawLandscape(u,LAND[isoU]||'redmounts');
  drawWalls(u);
  drawFloorEdge(u);
  const rugOn=RUGW[isoU], rB=darken(u.accent,0.6), rI=darken(u.accent,0.38), rI2=darken(u.accent,0.3);
  for(let gy=0;gy<GRID;gy++)for(let gx=0;gx<GRID;gx++){const p=isoPt(gx,gy);
    let col=((gx+gy)%2)?fA:fB;
    if(hsh(gx*3+1,gy*3+2)>0.9)col=darken(u.pal[2],0.5);
    const rz=RUGZ[isoU]||[2,3,6,6];
    if(rugOn&&gx>=rz[0]&&gx<=rz[2]&&gy>=rz[1]&&gy<=rz[3]){const ed=(gx<rz[0]+1||gx>rz[2]-1||gy<rz[1]+1||gy>rz[3]-1);col=ed?rB:(((gx+gy)%2)?rI:rI2);}
    diamond(p.x,p.y,col);
    if(rugOn&&gx===4&&gy===4&&isoU!=='express'){ix.fillStyle=u.accent;ix.globalAlpha=.5;ix.beginPath();ix.arc(p.x,p.y,4,0,7);ix.fill();ix.globalAlpha=1;}}
  if(isoSlab)drawSlab(isoSlab[0],isoSlab[1],isoSlab[2],isoSlab[3],isoSlab[4],u);
  {const cxr=isoOX,cyr=isoOY+GRID*TH*0.55;ix.save();ix.globalCompositeOperation='lighter';const lg=ix.createRadialGradient(cxr,cyr,10,cxr,cyr,GRID*TW*0.55);lg.addColorStop(0,'rgba(255,222,166,.10)');lg.addColorStop(1,'rgba(255,222,166,0)');ix.fillStyle=lg;ix.fillRect(0,0,iW,iH);ix.restore();}
  const items=[];
  isoProps.forEach(pr=>items.push({gx:pr.gx,gy:pr.gy,type:'prop',k:pr.k,lift:pr.lift||0}));
  chars.forEach(ch=>{
    if(ch.path){const nx=ch.path[(ch.pi+1)%ch.path.length];const dx=nx[0]-ch.gx,dy=nx[1]-ch.gy,d=Math.hypot(dx,dy);if(d<0.06)ch.pi=(ch.pi+1)%ch.path.length;else{ch.gx+=dx/d*ch.spd;ch.gy+=dy/d*ch.spd;}}
    items.push({gx:ch.gx,gy:ch.gy,type:'char',ch,lift:ch.lift||0});});
  if(isoDuck){moveDuck(isoDuck);items.push({gx:isoDuck.gx,gy:isoDuck.gy,type:'duck',obj:isoDuck});}
  if(isoAvatar){moveDuck(isoAvatar);items.push({gx:isoAvatar.gx,gy:isoAvatar.gy,type:'duck',obj:isoAvatar});}
  items.sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
  items.forEach(it=>{const p=isoPt(it.gx,it.gy);const yy=p.y-(it.lift||0);
    if(it.type==='prop'){ix.save();ix.globalAlpha=.2;ix.fillStyle='#000';ix.beginPath();ix.ellipse(p.x,yy+2,13,5,0,0,7);ix.fill();ix.restore();drawProp(p.x,yy,it.k,u);}
    else if(it.type==='duck')drawIsoDuck(p.x,yy,it.obj);
    else{const hop=(it.ch.sit||it.ch.chef||it.ch.cook||it.ch.bar)?0:Math.sin(isoT*2.2+it.gx)*1.2;drawPerson(p.x,yy,it.ch.c,hop,it.ch);}});
  if(isoU==='carta')drawChandelier(4,5.2,u);
  for(const m of isoMotes){m.y-=m.s;m.x+=Math.sin(isoT*0.8+m.ph)*0.25;if(m.y<-8){m.y=iH+8;m.x=Math.random()*iW;}ix.globalAlpha=m.a*(0.45+0.55*Math.sin(isoT*2+m.ph));ix.fillStyle=m.c;ix.fillRect(m.x|0,m.y|0,m.z,m.z);}
  ix.globalAlpha=1;
  {const vg=ix.createRadialGradient(iW/2,iH*0.46,Math.min(iW,iH)*0.3,iW/2,iH*0.52,Math.max(iW,iH)*0.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,3,10,.52)');ix.fillStyle=vg;ix.fillRect(0,0,iW,iH);}
  isoRAF=requestAnimationFrame(isoLoop);}
function openIso(id){exitFocus();isoU=id;const u=U[id];
  const ov=document.getElementById('iso');ov.classList.add('open');
  ov.style.background='radial-gradient(circle at 50% 30%,'+darken(u.pal[2],0.55)+',#06060f 80%)';
  document.getElementById('isoWorldTitle').textContent='MUNDO '+u.name.toUpperCase()+' · '+u.label.toUpperCase();

   : `<button class="go" style="background:${u.accent};color:${tc}" onclick="waMsg('Hola LQS 👋, avísenme cuando ${u.name} esté listo.')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="18" height="18"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.2-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg> Avísame cuando esté</button>`;
   // paneles laterales

   document.getElementById('isoSideL').style.borderColor=u.accent;document.getElementById('isoSideR').style.borderColor=u.accent;
   document.getElementById('srSvc').innerHTML=(u.svc||[]).map(s=>`<span>${s}</span>`).join('');
   document.getElementById('srCta').innerHTML=document.getElementById('isoCta').innerHTML;
  isoInit();cancelAnimationFrame(isoRAF);isoLoop();beep(560);}

/* ===== onboarding / avatar ===== */
var USER=null;
const gCv=document.getElementById('gateDuck'), gcx=gCv&&gCv.getContext('2d');
const SWCOLORS=['#57e0ff','#ff6a8a','#ffd24a','#57e0b0','#a97bd6','#ff9a5a','#5b8def','#e0614a'];
let regColor=SWCOLORS[0], gAnim=null;
function drawGateDuck(){if(!gcx)return;const u=8,map=DUCK_NB,rows=map.length,cols=map[0].length;const ox=(gCv.width-cols*u)/2,oy=gCv.height-rows*u-10;gcx.clearRect(0,0,gCv.width,gCv.height);
 gcx.fillStyle='rgba(0,0,0,.28)';gcx.beginPath();gcx.ellipse(gCv.width/2,gCv.height-8,cols*u*0.34,4,0,0,7);gcx.fill();
 const bob=Math.sin(performance.now()/450)*2;
 for(let r=0;r<rows;r++){const ln=map[r];for(let c=0;c<cols;c++){const ch=ln[c];if(ch===' ')continue;let col=DUCKCOL[ch];if(ch==='w')col='#fffdf5';gcx.fillStyle=col||'#fff';gcx.fillRect(Math.round(ox+c*u),Math.round(oy+r*u-bob),Math.ceil(u),Math.ceil(u));}}
 const wa=Math.sin(performance.now()/240)*0.5+0.5;gcx.save();gcx.translate(ox+cols*u-1*u,oy+7*u-bob);gcx.rotate(-0.5-wa*0.9);gcx.fillStyle='#e6d9bd';gcx.fillRect(0,-u,3.4*u,2.2*u);gcx.restore();
 gAnim=requestAnimationFrame(drawGateDuck);}
function gateInit(){const sw=document.getElementById('regSwatches');if(sw)sw.innerHTML=SWCOLORS.map((c,i)=>`<span class="sw${i===0?' on':''}" style="background:${c}" onclick="pickColor('${c}',this)"></span>`).join('');
 if(USER){document.getElementById('gate').classList.add('hide');} else {drawGateDuck();}}

function gateShowReg(){document.getElementById('gateMain').style.display='none';document.getElementById('gateReg').style.display='flex';}

function closeGate(){document.getElementById('gate').classList.add('hide');cancelAnimationFrame(gAnim);}

function gateCreate(){const n=(document.getElementById('regName').value||'Tú').trim().slice(0,12)||'Tú';USER={name:n,color:regColor};localStorage.setItem('lqsUser',JSON.stringify(USER));closeGate();toast('¡Listo '+n+'! Tu avatar te espera en cada mundo 🐥');}
function gateLogin(){const n=(prompt('Tu nombre de tripulante:','')||'').trim().slice(0,12);if(n){USER={name:n,color:'#57e0ff'};localStorage.setItem('lqsUser',JSON.stringify(USER));toast('¡Hola de nuevo, '+n+'! ✨');}closeGate();}

init();
